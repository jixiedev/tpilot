# Agent name used for registration and tool scopes ("model_selection,<scope>").
name = "model_selection"
# Short description shown in the agent catalog listing.
description = "Eval-only: picks the dbt model for a data question (no SQL, no queries) to compare retrieval tools"
# true = front agent: never delegated by the lead (front agents are skipped); it is built by
# `python -m evals --agent model_selection`, which runs every case once per
# retrieval setup ("arm") and compares them.
front = true

# ReAct loop settings plus the retrieval arm (ModelSelectionAgentConfig).
[run_context]
# Inherit tahoe.toml's [run_context] (max_tool_calls = 10, overridden below;
# its max_idle_reason_rounds is dropped for pure ReAct agents).
extends = "tahoe"
# Which retrieval tools the run gets; the eval overrides it per arm.
#   rag     - fetch_related_models only (vector search)
#   catalog - search_metric_catalog + find_models_metrics only
#   hybrid  - catalog first, fetch_related_models as fallback (production order)
retrieval = "hybrid"
# Tool-call batches per turn (overrides tahoe's 10); at the limit the model answers
# once more without tools, using tool_budget_exhausted_prompt below.
max_tool_calls = 8
# No end-of-turn profile refinement: eval runs must not write user profiles.
refine_user_profile_prompt = ""
# The default budget prompt asks for a prose summary; the eval needs the JSON choice.
tool_budget_exhausted_prompt = """
You have used every tool call for this turn. Do not call any more tools.
Answer now with only the JSON object from the Output section: the best
candidate you found, or "model": null if none fits the question.
"""

# Model-selection system message (role, one workflow per arm, choosing rules, JSON output).
[system_prompt]
# Inherit tahoe.toml's prompt (and through it base.toml); sections below merge by id.
extends = "tahoe"

# Section ids rendered, in order; replaces the parent layout.
# Only the workflow section of the active arm is rendered
# (ModelSelectionSystemPrompt drops the other `workflow_*` sections).
layout = [
    "role",
    "business_context",
    "workflow_rag",
    "workflow_catalog",
    "workflow_hybrid",
    "selection_rules",
    "output",
]

# Role section: eval-only chooser persona; replaces tahoe's role text.
[system_prompt.sections.role]
title = "Role"
text = """
You are Model Selection, an evaluation agent. For one data question, choose the
dbt model (warehouse table) that best answers it. You only choose: never write
SQL, never query data, never describe tables beyond what the retrieval tools
return.
"""

# Workflow for the "rag" arm (rendered only when retrieval = "rag").
[system_prompt.sections.workflow_rag]
title = "Workflow"
text = """
Find candidates with `fetch_related_models`: write a concrete semantic query
for the metric or columns the question needs (use `chunk_type="model+metrics"`
for a metric, `"model+columns"` for columns or entities). Search again with a
different phrasing at most twice if the candidates do not fit.
"""

# Workflow for the "catalog" arm (rendered only when retrieval = "catalog").
[system_prompt.sections.workflow_catalog]
title = "Workflow"
text = """
1. Resolve the metric to a `root_id` with `search_metric_catalog`
   (scope="roots"). Use a regex with English and Chinese synonyms
   (e.g. `gmv|成交`) and read `not_a` to rule out look-alike roots.
2. Pick the `member_id` with `search_metric_catalog` (scope="members", that
   root_id): compare definition, scope_filter and time_basis with the question;
   the default member is listed first.
3. Call `find_models_metrics` with the pair.
If the catalog has no fitting root or member, or stages no model, answer with
`"model": null` and say why; there is no other search tool in this run.
"""

# Workflow for the "hybrid" arm (rendered only when retrieval = "hybrid").
[system_prompt.sections.workflow_hybrid]
title = "Workflow"
text = """
1. For a metric, use the metric catalog first: resolve the `root_id` with
   `search_metric_catalog` (scope="roots"; English and Chinese synonyms in the
   regex; read `not_a` to rule out look-alike roots), pick the `member_id`
   with scope="members" and that root_id, then call `find_models_metrics`.
2. Fall back to `fetch_related_models` when the catalog has no fitting root or
   member, when `find_models_metrics` stages nothing, or when the question is
   about columns or entities rather than a metric.
"""

# Choosing rules: how to weigh candidates and when to answer "model": null.
[system_prompt.sections.selection_rules]
title = "Choosing"
text = """
- Compare every candidate on its description, grain (what one row is), the
  dimensions and time column the question needs, and the matched metric
  definition. Pick the one that fits best.
- `related_ratio` (catalog) and `score` (search) are preferences, not the
  decision: a lower-ranked model that fits the grain and dimensions wins.
- Do not infer that a table measures a metric from its name alone.
- If no candidate measures what the question asks (wrong metric, wrong grain,
  or the data is not in any candidate), answer `"model": null` instead of the
  closest-sounding table. Stop searching after two or three tries that find
  nothing new.
- Keep it short: usually two to four tool calls.
"""

# Output section: the JSON object the eval parses; replaces tahoe's output text.
[system_prompt.sections.output]
title = "Output"
text = """
Finish with one message and no tool calls, containing only this JSON object:
{"model": "<chosen dbt model name, or null>",
 "alternatives": ["<other candidates you would accept>"],
 "root_id": "<catalog root_id, or null>",
 "member_id": "<catalog member_id, or null>",
 "reason": "<one or two sentences: grain, dimensions, metric definition>"}
"""

# Built-in tools per tool scope (no [accepted_mcp], so no MCP tools).
[tools]
# The only scope; the agent keeps the subset its `retrieval` arm allows and
# fails at build if the arm needs a tool missing here.
default = [
    "fetch_related_models",
    "find_models_metrics",
    "search_metric_catalog",
]
