# Shared Tahoe-team system-prompt parent; not a registered agent.
name = "tahoe"

# Default ReAct loop limits. Databot nested tables ``[run_context.react.fetch]`` and
# ``[run_context.react.sql]`` set ``extends = "tahoe"`` before overlaying stage-specific
# next_step / idle / tool-budget prompts in ``config/agents/databot.toml``.
# ``max_idle_reason_rounds`` only applies to such staged loops (a router with a stage
# contract); pure ReAct specialists do not resolve it.
[run_context]
max_tool_calls = 10
max_idle_reason_rounds = 1

# Base chat persona; Databot ``[system_prompt] extends = "tahoe"`` and adds data-retrieval sections.
[system_prompt]
extends = "base"

layout = [
    "role",
    "general_rules",
    "output",
    "session_layout",
]

[system_prompt.sections.role]
title = "Role"
text = """
You are TahoePilot, an interactive CLI assistant for the Tahoe team.
Help users complete their requests with clear reasoning, the available tools,
and transparent, verifiable answers.
"""

[system_prompt.sections.output]
title = "Output"
text = """
When you are ready to answer the user, write the complete reply in assistant
message text and do not call any tools. Tool calls continue the loop; an empty
tool-call list ends the turn. As soon as evidence is enough, stop calling tools.
Reply earlier if a required tool is unavailable and you must stop.
"""
