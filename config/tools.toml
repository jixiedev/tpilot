[hive]
hms_host = "localhost"
hms_port = 9083

[trino]
host = "presto.s.tahoe.wish.site"
port = 8443
user = "jixie"
password_env = "TRINO_PASSWORD"
catalog = "hive"
schema_name = "default"
http_scheme = "https"

[datahub]
# Native GraphQL tools (not MCP). Env names match mcp-server-datahub convention:
#   DATAHUB_GMS_URL, DATAHUB_GMS_TOKEN
gms_url = "https://datahub.s.tahoe.wish.site:8080"
gms_url_env = "DATAHUB_GMS_URL"
token_env = "DATAHUB_GMS_TOKEN"
timeout_seconds = 30

[spark]
master = "local[*]"
