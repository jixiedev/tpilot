# Runtime state locations and user defaults, read by settings/runtime_config.py.
# Paths may be absolute, start with ~, or be relative to the project root.

[paths]
# Root for all runtime data; every empty path below defaults under it. In k8s set it
# to the PVC mount (e.g. "/data").
data_dir = ".local"
# SQLite file holding LangGraph conversation checkpoints. Empty = <data_dir>/checkpoints.sqlite.
checkpoint_db = ""
# Directory of per-user profile JSON files. Empty = <data_dir>/profiles.
profiles_dir = ""
# Directory for offloaded large tool results and archives. Empty = <data_dir>/offload_store.
offload_dir = ""
# Directory for log files. Empty = <data_dir>/logs.
logs_dir = ""
# Log file path. Empty = <logs_dir>/tahoepilot.log.
log_file = ""
# Working folder of the code tools (bash, python_execute, str_replace_editor): they start
# here, the editor only accepts paths inside it, and none of them sees secrets.
# Empty = <data_dir>/workspace. Keep it outside the project folder.
workspace_dir = ""

[user]
# User id for profiles when none is given (CLI -u / UI). Empty = the OS user name.
default_id = ""
