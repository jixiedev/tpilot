[qdrant]
url = "http://localhost:6333"
api_key = ""
api_key_env = "QDRANT_API_KEY"
timeout_seconds = 30.0

[embedding]
# Local BGE-M3 via FlagEmbedding (dense + sparse). Remote embedding APIs are not used.
model = "BAAI/bge-m3"
vector_size = 1024
# Optional device override: "", "cpu", "cuda", "mps"
device = ""
# Keep local encode memory bounded (Jira descriptions can be huge).
# 512 tokens ≈ safe on CPU/MPS; raise only if you have spare GPU RAM.
max_seq_length = 512
max_chars = 2000
batch_size = 8

[rerank]
model = "BAAI/bge-reranker-v2-m3"
prefetch_limit = 50
