<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="agate-t agate-d"><title id="agate-t">An approval in the browser</title><desc id="agate-d">The agent stops at a gate. The browser shows the question and the options, and your decision resumes the same stage.</desc><defs><pattern id="agate-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="agate-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="agate-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="agate-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="agate-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#agate-grid)"/><rect width="100%" height="100%" fill="url(#agate-glow)"/><path d="M80 97.2 C220 43.2 380 151.20000000000002 520 86.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 388.8 C860 442.79999999999995 700 313.2 500 421.2" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 500 V512 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 500 V512 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="50" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="40" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHERE THE RUN STOPS</text><rect x="52" y="60" width="190" height="95" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="43" y="70" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="43" y="115" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="147.0" y="101.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The agent</text><text x="147.0" y="118.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">reaches an approval gate</text><path d="M367.5 58 L455 108.0 L367.5 158 L280 108.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="367.5" y="102.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">The gate</text><text x="367.5" y="119.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a decision you must make</text><path d="M490 60 H650 L665 75 V155 H490 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M650 60 V75 H665" fill="none" stroke="#334155" stroke-width="1.3"/><text x="577.5" y="101.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The run ends</text><text x="577.5" y="118.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">action required, not an answer</text><rect x="30" y="215" width="800" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="205" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">IN THE BROWSER</text><circle cx="89.0" cy="234" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M89.0 242 V268" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M76.0 250 H102.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 268 L78.0 286" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 268 L100.0 286" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="89.0" y="301.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><rect x="150" y="222" width="230" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="232" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="278" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="265.0" y="264.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Approval panel</text><text x="265.0" y="281.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the question and the options</text><rect x="490" y="222" width="195" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="481" y="232" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="481" y="278" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="587.5" y="264.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The chat banner</text><text x="587.5" y="281.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the run needs a decision</text><rect x="30" y="375" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="365" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">HOW THE RUN CONTINUES</text><path d="M150 388 H324 L340 430.5 L324 473 H150 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="237.0" y="424.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your decision</text><text x="237.0" y="441.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">posted back to the server</text><path d="M375 394 L387 382 H572 L560 394 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M560 394 L572 382 V477 L560 489 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="375" y="394" width="185" height="95" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="467.5" y="435.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">AG-UI server</text><text x="467.5" y="452.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">starts a new run</text><path d="M590 393 V468 A105.0 15 0 0 0 800 468 V393" fill="#ecfdf5" stroke="none"/><path d="M590 468 A105.0 15 0 0 0 800 468" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="590" y1="393" x2="590" y2="468" stroke="#00a165" stroke-width="1.4"/><line x1="800" y1="393" x2="800" y2="468" stroke="#00a165" stroke-width="1.4"/><ellipse cx="695.0" cy="393" rx="105.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="695.0" y="426.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Paused work</text><text x="695.0" y="443.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the checkpoint it picks up</text><circle cx="242" cy="107" r="2.4" fill="#00a165"/><line x1="242" y1="107" x2="278" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#agate-arr-a)"/><circle cx="455" cy="107" r="2.4" fill="#00a165"/><line x1="455" y1="107" x2="488" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#agate-arr-a)"/><path d="M280 108 C268 150 265 180 265 220" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#agate-arr)"/><rect x="110.0" y="178" width="140.0" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="180" y="190" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the browser is asked</text><circle cx="148" cy="265" r="2.4" fill="#334155"/><line x1="148" y1="265" x2="128" y2="265" stroke="#334155" stroke-width="1.6" marker-end="url(#agate-arr)"/><circle cx="265" cy="318" r="2.4" fill="#00a165"/><line x1="265" y1="318" x2="265" y2="386" stroke="#00a165" stroke-width="1.6" marker-end="url(#agate-arr-a)"/><circle cx="340" cy="430" r="2.4" fill="#00a165"/><line x1="340" y1="430" x2="373" y2="430" stroke="#00a165" stroke-width="1.6" marker-end="url(#agate-arr-a)"/><circle cx="572" cy="430" r="2.4" fill="#00a165"/><line x1="572" y1="430" x2="588" y2="430" stroke="#00a165" stroke-width="1.6" marker-end="url(#agate-arr-a)"/><path d="M467 380 V180 H370 V162" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#agate-arr-a)"/><rect x="375.6" y="330" width="88.80000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="420" y="342" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">it continues</text><circle cx="40" cy="520" r="7" fill="#334155"/><circle cx="40" cy="520" r="3.2" fill="#ffffff"/><text x="54" y="524" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">Your decision resumes the paused run exactly where it stopped.</text><rect x="850" y="50" width="240" height="290" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="80" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT NEEDS APPROVAL</text><rect x="872" y="100" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="110" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="127" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="123.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Which tables to use</text><rect x="872" y="162" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="172" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="189" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="185.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Which query to run</text><rect x="872" y="224" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="234" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="251" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="247.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Anything that would write</text></svg>