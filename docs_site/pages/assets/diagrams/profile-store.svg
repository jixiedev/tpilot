oke-width="1.3"/><text x="968.0" y="252.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Changes apply next time</text><text x="968.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a session keeps its start</text><path d="M868 330 H1053 L1068 345 V426 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 330 V345 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Forget it any time</text><text x="968.0" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">delete the file and it is gone</text><circle cx="868" cy="470" r="7" fill="#334155"/><circle cx="868" cy="470" r="3.2" fill="#ffffff"/><text x="882" y="474" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">you never repeat yourself</text></svg>