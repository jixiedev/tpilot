le cx="340" cy="193" r="3.2" fill="#ffffff"/><text x="354" y="197" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">the columns you may not see</text><circle cx="340" cy="227" r="7" fill="#334155"/><circle cx="340" cy="227" r="3.2" fill="#ffffff"/><text x="354" y="231" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">your language and currency</text><rect x="30" y="290" width="800" height="215" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="280" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">HOW THE RECORD MOVES</text><rect x="60" y="320" width="190" height="66" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="155.0" y="347.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Load it once a session</text><text x="155.0" y="364.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">at the start of a session</text><rect x="280" y="320" width="190" height="66" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="375.0" y="347.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Refine after every turn</text><text x="375.0" y="364.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what we learned is merged in</text><path d="M500 325 V420 A115.0 15 0 0 0 730 420 V325" fill="#ecfdf5" stroke="none"/><path d="M500 420 A115.0 15 0 0 0 730 420" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="500" y1="325" x2="500" y2="420" stroke="#00a165" stroke-width="1.4"/><line x1="730" y1="325" x2="730" y2="420" str