<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-labelledby="prof-t prof-d"><title id="prof-t">What is remembered about you</title><desc id="prof-d">A profile is a small record per person: who you are, what you may read, and how you like answers. It is refined after every turn and written through to disk.</desc><defs><pattern id="prof-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="prof-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="prof-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="prof-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="prof-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#prof-grid)"/><rect width="100%" height="100%" fill="url(#prof-glow)"/><path d="M80 104.39999999999999 C220 46.4 380 162.4 520 92.8" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 417.59999999999997 C860 475.59999999999997 700 336.4 500 452.40000000000003" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 540 V552 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 540 V552 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="210" rx="8" fill="#ffffff" stroke="rgba(0,