<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="tbw-t tbw-d"><title id="tbw-t">One turn in the browser</title><desc id="tbw-d">The chat panel sends the question to the server, the server runs the agent, and the events stream back while the turn runs.</desc><defs><pattern id="tbw-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="tbw-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="tbw-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="tbw-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="tbw-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#tbw-grid)"/><rect width="100%" height="100%" fill="url(#tbw-glow)"/><path d="M80 108.0 C220 48.0 380 168.00000000000003 520 96.0" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 432.0 C860 491.99999999999994 700 348.0 500 468.0" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 560 V572 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 560 V572 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="790" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">IN THE BROWSER</text><rect x="30" y="190" width="790" height="110" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="180" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE SERVER</text><rect x="30" y="335" width="790" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="325" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE AGENT</text><rect x="30" y="470" width="790" height="100" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="460" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHEN THE TURN PAUSES</text><circle cx="99.0" cy="67" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M99.0 75 V101" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M86.0 83 H112.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M99.0 101 L88.0 119" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M99.0 101 L110.0 119" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="99.0" y="140.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><path d="M175 72 L187 60 H422 L410 72 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M410 72 L422 60 V138 L410 150 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="175" y="72" width="235" height="78" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="292.5" y="105.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Web app</text><text x="292.5" y="122.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">Next.js, the chat panel</text><path d="M455 64 H650 L665 79 V136 H455 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M650 64 V79 H665" fill="none" stroke="#334155" stroke-width="1.3"/><text x="560.0" y="94.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The answer</text><text x="560.0" y="111.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">shown in the chat</text><circle cx="112" cy="100" r="2.4" fill="#00a165"/><line x1="112" y1="100" x2="173" y2="100" stroke="#00a165" stroke-width="1.6" marker-end="url(#tbw-arr-a)"/><circle cx="424" cy="100" r="2.4" fill="#00a165"/><line x1="424" y1="100" x2="453" y2="100" stroke="#00a165" stroke-width="1.6" marker-end="url(#tbw-arr-a)"/><path d="M55 217 L67 205 H317 L305 217 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M305 217 L317 205 V283 L305 295 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="55" y="217" width="250" height="78" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="180.0" y="250.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Chat endpoint</text><text x="180.0" y="267.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">Next.js forwards the request</text><path d="M350 217 L362 205 H617 L605 217 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M605 217 L617 205 V283 L605 295 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/>