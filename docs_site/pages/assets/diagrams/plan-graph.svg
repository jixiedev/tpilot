<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="plan-t plan-d"><title id="plan-t">How a multi-step plan is planned</title><desc id="plan-d">The plan agent writes the plan, delegates each step to a specialist, adjusts the plan when the work changes, and closes with a summary.</desc><defs><pattern id="plan-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="plan-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="plan-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="plan-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="plan-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#plan-grid)"/><rect width="100%" height="100%" fill="url(#plan-glow)"/><path d="M80 118.8 C220 52.800000000000004 380 184.8 520 105.60000000000001" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 475.2 C860 541.1999999999999 700 382.79999999999995 500 514.8000000000001" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 620 V632 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 620 V632 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="760" height="95" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">YOU</text><circle cx="95.0" cy="64" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M95.0 72 V98" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M82.0 80 H108.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 98 L84.0 116" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M95.0 98 L106.0 116" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="95.0" y="127.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><path d="M185 62 H399 L415 93.0 L399 124 H185 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="292.0" y="87.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your question</text><text x="292.0" y="104.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">that needs several specialists</text><rect x="30" y="175" width="760" height="125" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="165" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE PLAN AGENT</text><rect x="60" y="187" width="250" height="95" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="197" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="242" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="185.0" y="228.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The plan agent</text><text x="185.0" y="245.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">plan · writes the steps</text><path d="M370 190 H560 V268 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 L370 268 Z" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="465.0" y="223.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The plan</text><text x="465.0" y="240.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">steps and who does each</text><rect x="30" y="340" width="760" height="150" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="330" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">ONE STEP AT A TIME</text><rect x="60" y="355" width="250" height="100" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="365" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="413" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="185.0" y="399.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The step's specialist</text><text x="185.0" y="416.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">runs on its own</text><path d="M460.0 355 L550 405.0 L460.0 455 L370 405.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="460.0" y="405.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Still on track?</text><rect x="610" y="355" width="180" height="100" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="601" y="365" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="601" y="413" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="700.0" y="399.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Adjust the plan</text><text x="700.0" y="416.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">add, skip or rewrite a step</text><rect x="30" y="530" width="760" height="80" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="520" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE END</text><path d="M360 530 H535 L550 545 V610 H360 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M535 530 V545 H550" fill="none" stroke="#334155" stroke-width="1.3"/><text x="455.0" y="564.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The summary</text><text x="455.0" y="581.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one answer for the whole task</text><circle cx="130" cy="88" r="2.4" fill="#00a165"/><line x1="130" y1="88" x2="182" y2="90" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><path d="M300 126 C300 154 185 152 185 183" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><circle cx="312" cy="234" r="2.4" fill="#00a165"/><line x1="312" y1="234" x2="368" y2="234" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><path d="M465 282 C465 318 185 305 185 353" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><rect x="205.6" y="308" width="88.80000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="250" y="320" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">step by step</text><circle cx="312" cy="405" r="2.4" fill="#00a165"/><line x1="312" y1="405" x2="368" y2="405" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><circle cx="552" cy="405" r="2.4" fill="#00a165"/><line x1="552" y1="405" x2="598" y2="405" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><rect x="529.6" y="416" width="56.800000000000004" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="558" y="428" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">changed</text><path d="M700 458 C700 482 185 482 185 458" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#plan-arr-a)"/><rect x="384.8" y="464" width="114.4" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="442" y="476" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the plan changes</text><path d="M460 457 C460 495 455 495 455 528" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#plan-arr-a)"/><rect x="462.8" y="500" width="114.4" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="520" y="512" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the plan is done</text><rect x="810" y="45" width="280" height="565" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT EACH STEP GETS</text><rect x="832" y="92" width="236" height="60" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="102" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="127" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="950.0" y="116.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Its own tools</text><text x="950.0" y="133.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">only what that step needs</text><rect x="832" y="172" width="236" height="60" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="182" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="207" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="950.0" y="196.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Its own conversation</text><text x="950.0" y="213.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the step's own history</text><rect x="832" y="252" width="236" height="60" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="262" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="287" width="9" height="13" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="950.0" y="276.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Its own budget</text><text x="950.0" y="293.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a fresh allowance each time</text><path d="M832 350 H1053 L1068 365 V450 H832 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 350 V365 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="950.0" y="394.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Steps stay apart</text><text x="950.0" y="411.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one step never sees the others</text><circle cx="40" cy="645" r="7" fill="#334155"/><circle cx="40" cy="645" r="3.2" fill="#ffffff"/><text x="54" y="649" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">A step never sees another step's history.</text></svg>