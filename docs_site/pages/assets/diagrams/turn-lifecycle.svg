<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="life-t life-d"><title id="life-t">The life of one turn</title><desc id="life-d">The agent is built once. Each turn accepts the question, runs, commits, and prints the answer. Cancelling skips the commit.</desc><defs><pattern id="life-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="life-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="life-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="life-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="life-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#life-grid)"/><rect width="100%" height="100%" fill="url(#life-glow)"/><path d="M80 106.2 C220 47.2 380 165.20000000000002 520 94.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 424.8 C860 483.79999999999995 700 342.2 500 460.2" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 550 V562 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 550 V562 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="790" height="100" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">STEP 1 · THE AGENT IS BUILT ONCE</text><rect x="30" y="175" width="790" height="100" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="165" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">STEP 2 · YOUR QUESTION IS ACCEPTED</text><rect x="30" y="305" width="790" height="110" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="295" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">STEP 3 · THE AGENT WORKS</text><rect x="30" y="445" width="790" height="110" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="435" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">STEP 4 · THE TURN IS COMMITTED</text><rect x="55" y="58" width="250" height="76" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="46" y="68" width="9" height="17" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="46" y="102" width="9" height="17" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="180.0" y="90.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Agent catalog</text><text x="180.0" y="107.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">binds tools, memory and prompts</text><rect x="350" y="58" width="230" height="76" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="341" y="68" width="9" height="17" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="341" y="102" width="9" height="17" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="465.0" y="90.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Your agent</text><text x="465.0" y="107.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the specialist you chose</text><circle cx="305" cy="96" r="2.4" fill="#00a165"/><line x1="305" y1="96" x2="348" y2="96" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><path d="M55 192 H229 L245 226.0 L229 260 H55 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="142.0" y="220.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your question</text><text x="142.0" y="237.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">typed in the terminal</text><rect x="285" y="190" width="250" height="72" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="410.0" y="220.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Accept</text><text x="410.0" y="237.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">history, profile and session</text><circle cx="245" cy="226" r="2.4" fill="#00a165"/><line x1="245" y1="226" x2="283" y2="226" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><path d="M465 134 V160 H410 V188" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><rect x="55" y="320" width="250" height="76" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="180.0" y="352.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Run the turn</text><text x="180.0" y="369.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the model decides, the tools act</text><path d="M435.0 315 L510 363.0 L435.0 411 L360 363.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="435.0" y="357.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Cancel?</text><text x="435.0" y="374.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">you stop it</text><path d="M600 320 H775 L790 335 V396 H600 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M775 320 V335 H790" fill="none" stroke="#334155" stroke-width="1.3"/><text x="695.0" y="352.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Nothing is saved</text><text x="695.0" y="369.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the commit is skipped</text><circle cx="305" cy="358" r="2.4" fill="#00a165"/><line x1="305" y1="358" x2="358" y2="358" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><path d="M512 358 H598" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#life-arr-a)"/><rect x="55" y="460" width="250" height="76" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="180.0" y="492.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Commit</text><text x="180.0" y="509.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">saves the checkpoint and your profile</text><path d="M365 460 H590 L605 475 V536 H365 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M590 460 V475 H605" fill="none" stroke="#334155" stroke-width="1.3"/><text x="485.0" y="492.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Your answer</text><text x="485.0" y="509.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">printed in the terminal</text><circle cx="305" cy="498" r="2.4" fill="#00a165"/><line x1="305" y1="498" x2="363" y2="498" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><path d="M435 411 V432 H180 V458" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#life-arr-a)"/><rect x="252.4" y="412" width="95.2" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="300" y="424" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">it carries on</text><circle cx="30" cy="578" r="7" fill="#334155"/><circle cx="30" cy="578" r="3.2" fill="#ffffff"/><text x="44" y="582" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">Cancelling skips the commit, so nothing about this turn is remembered.</text><rect x="845" y="45" width="245" height="305" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="865" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT THE TURN USES</text><path d="M865 110 V146 A102.5 15 0 0 0 1070 146 V110" fill="#ecfdf5" stroke="none"/><path d="M865 146 A102.5 15 0 0 0 1070 146" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="865" y1="110" x2="865" y2="146" stroke="#00a165" stroke-width="1.4"/><line x1="1070" y1="110" x2="1070" y2="146" stroke="#00a165" stroke-width="1.4"/><ellipse cx="967.5" cy="110" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="967.5" y="123.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Session history</text><text x="967.5" y="140.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">earlier questions</text><path d="M865 195 V231 A102.5 15 0 0 0 1070 231 V195" fill="#ecfdf5" stroke="none"/><path d="M865 231 A102.5 15 0 0 0 1070 231" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="865" y1="195" x2="865" y2="231" stroke="#00a165" stroke-width="1.4"/><line x1="1070" y1="195" x2="1070" y2="231" stroke="#00a165" stroke-width="1.4"/><ellipse cx="967.5" cy="195" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="967.5" y="208.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Your profile</text><text x="967.5" y="225.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what we know about you</text><path d="M865 280 V316 A102.5 15 0 0 0 1070 316 V280" fill="#ecfdf5" stroke="none"/><path d="M865 316 A102.5 15 0 0 0 1070 316" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="865" y1="280" x2="865" y2="316" stroke="#00a165" stroke-width="1.4"/><line x1="1070" y1="280" x2="1070" y2="316" stroke="#00a165" stroke-width="1.4"/><ellipse cx="967.5" cy="280" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="967.5" y="293.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Checkpoints</text><text x="967.5" y="310.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">where the turn is saved</text><path d="M865 128 H835 M865 213 H835 M865 298 H835" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/><path d="M835 128 V226 H537" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#life-arr-a)"/><rect x="620.0" y="200" width="140.0" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="690" y="212" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">it starts from these</text></svg>