<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="comp-t comp-d"><title id="comp-t">The compressor</title><desc id="comp-d">When the window fills up, content leaves it in four steps, cheapest first: offload big results, fold old turns, evict write inputs, and only then ask the model to summarize. Every copy is written to disk before anything is removed.</desc><defs><pattern id="comp-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="comp-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="comp-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="comp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="comp-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#comp-grid)"/><rect width="100%" height="100%" fill="url(#comp-glow)"/><path d="M80 108.0 C220 48.0 380 168.00000000000003 520 96.0" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 432.0 C860 491.99999999999994 700 348.0 500 468.0" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 560 V572 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 560 V572 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="505" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE WINDOW NARROWS</text><path d="M40.0 60 H500.0 L475.0 146 H65.0 Z" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1.3"/><text x="270" y="107.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The window is full</text><text x="270" y="124.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5f6f80">everything in play right now</text><path d="M65.0 146 H475.0 L450.0 232 H90.0 Z" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1.3"/><text x="270" y="193.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Room appears</text><text x="270" y="210.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5f6f80">the big results moved out</text><path d="M90.0 232 H450.0 L425.0 318 H115.0 Z" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1.3"/><text x="270" y="279.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Less to carry</text><text x="270" y="296.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5f6f80">the old turns are folded away</text><path d="M115.0 318 H425.0 L400.0 404 H140.0 Z" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1.3"/><text x="270" y="365.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Only the essentials</text><text x="270" y="382.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5f6f80">the write inputs are gone</text><path d="M140.0 404 H400.0 L400.0 490 H140.0 Z" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1.3"/><text x="270" y="451.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Room again</text><text x="270" y="468.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5f6f80">the window is usable</text><rect x="520" y="74" width="290" height="58" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="665.0" y="97.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Offload the big results</text><text x="665.0" y="114.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a disk write instead of the payload</text><rect x="520" y="160" width="290" height="58" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="665.0" y="183.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Fold the old turns</text><text x="665.0" y="200.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your questions and the answers you saw</text><rect x="520" y="246" width="290" height="58" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="665.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Evict the write inputs</text><text x="665.0" y="286.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the write has already happened</text><rect x="520" y="332" width="290" height="58" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="665.0" y="355.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Summarize</text><text x="665.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the model — the last resort</text><circle cx="665" cy="132" r="2.4" fill="#00a165"/><line x1="665" y1="132" x2="665" y2="158" stroke="#00a165" stroke-width="1.6" marker-end="url(#comp-arr-a)"/><circle cx="665" cy="218" r="2.4" fill="#00a165"/><line x1="665" y1="218" x2="665" y2="244" stroke="#00a165" stroke-width="1.6" marker-end="url(#comp-arr-a)"/><circle cx="665" cy="304" r="2.4" fill="#00a165"/><line x1="665" y1="304" x2="665" y2="330" stroke="#00a165" stroke-width="1.6" marker-end="url(#comp-arr-a)"/><path d="M520 420 H795 L810 435 V516 H520 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M795 420 V435 H810" fill="none" stroke="#334155" stroke-width="1.3"/><text x="665.0" y="462.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">What stays</text><text x="665.0" y="479.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a summary and the recent turns</text><circle cx="665" cy="390" r="2.4" fill="#00a165"/><line x1="665" y1="390" x2="665" y2="418" stroke="#00a165" stroke-width="1.6" marker-end="url(#comp-arr-a)"/><circle cx="60" cy="522" r="7" fill="#334155"/><circle cx="60" cy="522" r="3.2" fill="#ffffff"/><text x="74" y="526" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">a copy first, always</text><rect x="850" y="45" width="240" height="505" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">ON DISK</text><path d="M868 120 V240 A100.0 15 0 0 0 1068 240 V120" fill="#ecfdf5" stroke="none"/><path d="M868 240 A100.0 15 0 0 0 1068 240" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="868" y1="120" x2="868" y2="240" stroke="#00a165" stroke-width="1.4"/><line x1="1068" y1="120" x2="1068" y2="240" stroke="#00a165" stroke-width="1.4"/><ellipse cx="968.0" cy="120" rx="100.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="968.0" y="175.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The archive</text><text x="968.0" y="192.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">every copy, written first</text><path d="M868 285 H1053 L1068 300 V381 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 285 V300 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="327.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The model is last</text><text x="968.0" y="344.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">only when nothing cheaper worked</text><path d="M868 405 H1053 L1068 420 V501 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 405 V420 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="447.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Old files are pruned</text><text x="968.0" y="464.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">after a set number of days</text><path d="M812 103 C840 103 844 130 866 130" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#comp-arr-a)"/><path d="M812 189 C840 189 844 165 866 165" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#comp-arr-a)"/><path d="M812 275 C840 275 844 200 866 200" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#comp-arr-a)"/><path d="M812 361 C840 361 844 235 866 235" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#comp-arr-a)"/></svg>