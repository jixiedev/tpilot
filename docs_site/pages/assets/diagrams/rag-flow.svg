<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="rag-t rag-d"><title id="rag-t">How a question is answered from the knowledge base</title><desc id="rag-d">A scheduled job fills the index. A question goes out as a vector search and a keyword search, the results are merged, the best matches are reranked and duplicates are removed.</desc><defs><pattern id="rag-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="rag-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="rag-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="rag-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="rag-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#rag-grid)"/><rect width="100%" height="100%" fill="url(#rag-glow)"/><path d="M80 111.6 C220 49.6 380 173.60000000000002 520 99.2" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 446.4 C860 508.4 700 359.59999999999997 500 483.6" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 580 V592 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 580 V592 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="50" width="800" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="40" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">HOW THE INDEX IS FILLED</text><path d="M105.5 156 a29.750000000000004 29.4 0 0 1 3.5 -41.16 a42.0 35.28 0 0 1 77.0 -13.72 a35.0 27.44 0 0 1 52.5 54.88 Z" fill="#eef4fb" stroke="#15467d" stroke-width="1.4"/><text x="147.5" y="123.66" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your material</text><rect x="260" y="58" width="150" height="98" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="335.0" y="101.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Chunking</text><text x="335.0" y="118.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">paragraphs become chunks</text><rect x="430" y="58" width="160" height="98" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="510.0" y="101.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Embedding</text><text x="510.0" y="118.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">meaning and words</text><path d="M605 63 V145 A102.5 15 0 0 0 810 145 V63" fill="#ecfdf5" stroke="none"/><path d="M605 145 A102.5 15 0 0 0 810 145" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="605" y1="63" x2="605" y2="145" stroke="#00a165" stroke-width="1.4"/><line x1="810" y1="63" x2="810" y2="145" stroke="#00a165" stroke-width="1.4"/><ellipse cx="707.5" cy="63" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="707.5" y="99.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The knowledge index</text><text x="707.5" y="116.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">Qdrant, on your machine</text><rect x="30" y="200" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="190" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">YOUR QUESTION</text><circle cx="89.0" cy="220" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M89.0 228 V254" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M76.0 236 H102.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 254 L78.0 272" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 254 L100.0 272" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="89.0" y="287.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><path d="M145 215 H274 L290 257.5 L274 300 H145 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="209.5" y="251.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your question</text><text x="209.5" y="268.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the same words</text><rect x="320" y="210" width="175" height="88" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="407.5" y="248.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Vector search</text><text x="407.5" y="265.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">meaning, not wording</text><rect x="540" y="210" width="175" height="88" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="627.5" y="248.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Keyword search</text><text x="627.5" y="265.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the exact terms</text><rect x="30" y="345" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="335" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">ONE RANKED LIST</text><rect x="400" y="355" width="340" height="90" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="570.0" y="394.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Merge the results</text><text x="570.0" y="411.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one list from both searches</text><rect x="30" y="495" width="800" height="90" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="485" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE BEST MATCHES</text><rect x="150" y="505" width="190" height="80" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="245.0" y="539.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Rerank</text><text x="245.0" y="556.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">against your question</text><rect x="370" y="505" width="170" height="80" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="455.0" y="539.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Remove duplicates</text><text x="455.0" y="556.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one per ticket or model</text><path d="M570 505 H815 L830 520 V585 H570 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M815 505 V520 H830" fill="none" stroke="#334155" stroke-width="1.3"/><text x="700.0" y="539.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The passages the model reads</text><text x="700.0" y="556.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">grounded in your material</text><circle cx="240" cy="107" r="2.4" fill="#00a165"/><line x1="240" y1="107" x2="258" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="410" cy="107" r="2.4" fill="#00a165"/><line x1="410" y1="107" x2="428" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="590" cy="107" r="2.4" fill="#00a165"/><line x1="590" y1="107" x2="603" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="292" cy="252" r="2.4" fill="#00a165"/><line x1="292" y1="252" x2="308" y2="252" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="308" cy="225" r="2.4" fill="#334155"/><line x1="308" y1="225" x2="308" y2="280" stroke="#334155" stroke-width="1.6"/><path d="M308 225 H318" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><path d="M308 280 H318" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="660" cy="158" r="2.4" fill="#00a165"/><line x1="660" y1="158" x2="660" y2="208" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><path d="M607 138 C560 175 470 180 400 206" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="400" cy="298" r="2.4" fill="#00a165"/><line x1="400" y1="298" x2="400" y2="353" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="627" cy="298" r="2.4" fill="#00a165"/><line x1="627" y1="298" x2="627" y2="353" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><path d="M570 447 V470 H245 V503" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="340" cy="545" r="2.4" fill="#00a165"/><line x1="340" y1="545" x2="368" y2="545" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><circle cx="540" cy="545" r="2.4" fill="#00a165"/><line x1="540" y1="545" x2="568" y2="545" stroke="#00a165" stroke-width="1.6" marker-end="url(#rag-arr-a)"/><rect x="850" y="50" width="240" height="290" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="80" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT IS INDEXED</text><rect x="872" y="100" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="110" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="127" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="123.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Your tickets</text><rect x="872" y="162" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="172" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x