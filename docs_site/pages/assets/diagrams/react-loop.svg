<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="react-t react-d"><title id="react-t">The reasoning loop</title><desc id="react-d">The model reads the turn and decides. If it wants tools they run and it looks again; if it has the answer the turn ends.</desc><defs><pattern id="react-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="react-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="react-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="react-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="react-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#react-grid)"/><rect width="100%" height="100%" fill="url(#react-glow)"/><path d="M80 108.0 C220 48.0 380 168.00000000000003 520 96.0" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 432.0 C860 491.99999999999994 700 348.0 500 468.0" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 560 V572 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 560 V572 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="790" height="100" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE TURN STARTS</text><rect x="30" y="175" width="790" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="165" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE MODEL DECIDES</text><rect x="30" y="320" width="790" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="310" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE TOOLS ACT</text><rect x="30" y="465" width="790" height="95" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="820" y="455" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE TURN ENDS</text><path d="M55 58 H244 L260 95.0 L244 132 H55 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="149.5" y="89.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your question</text><text x="149.5" y="106.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the turn begins</text><rect x="300" y="58" width="235" height="74" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="417.5" y="89.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Compress</text><text x="417.5" y="106.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the context is folded, before and after</text><circle cx="260" cy="95" r="2.4" fill="#00a165"/><line x1="260" y1="95" x2="298" y2="95" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><rect x="55" y="190" width="235" height="86" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="46" y="200" width="9" height="19" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="46" y="240" width="9" height="19" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="172.5" y="227.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Reason</text><text x="172.5" y="244.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the model reads and decides</text><path d="M425.0 185 L520 233.0 L425.0 281 L330 233.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="425.0" y="227.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Tools or answer?</text><text x="425.0" y="244.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what it wants to do</text><circle cx="290" cy="233" r="2.4" fill="#00a165"/><line x1="290" y1="233" x2="328" y2="233" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><rect x="330" y="335" width="190" height="86" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="321" y="345" width="9" height="19" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="321" y="385" width="9" height="19" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="425.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Act</text><text x="425.0" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the tools run</text><path d="M55 340 H264 L280 378.0 L264 416 H55 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="159.5" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Tool results</text><text x="159.5" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the tools answer back</text><path d="M425 281 V333" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><rect x="374.2" y="295" width="101.60000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="425" y="307" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#00875a">it wants tools</text><circle cx="328" cy="378" r="2.4" fill="#00a165"/><line x1="328" y1="378" x2="282" y2="378" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><path d="M167 340 V276" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><rect x="93.8" y="296" width="146.4" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="167" y="308" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#00875a">the model looks again</text><path d="M330 132 V158 H167 V188" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><path d="M540 478 H775 L790 493 V556 H540 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M775 478 V493 H790" fill="none" stroke="#334155" stroke-width="1.3"/><text x="665.0" y="511.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The answer</text><text x="665.0" y="528.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the model's reply</text><path d="M55 478 H290 L305 493 V556 H55 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M290 478 V493 H305" fill="none" stroke="#334155" stroke-width="1.3"/><text x="180.0" y="511.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The turn stops</text><text x="180.0" y="528.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the stage is complete</text><path d="M522 233 H665 V476" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#react-arr-a)"/><rect x="539.6" y="221" width="120.80000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="600" y="233" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#00875a">it has the answer</text><path d="M180 416 V476" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#react-arr-a)"/><rect x="845" y="45" width="245" height="335" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="865" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT THE LOOP WORKS WITH</text><path d="M865 110 V146 A102.5 15 0 0 0 1070 146 V110" fill="#ecfdf5" stroke="none"/><path d="M865 146 A102.5 15 0 0 0 1070 146" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="865" y1="110" x2="865" y2="146" stroke="#00a165" stroke-width="1.4"/><line x1="1070" y1="110" x2="1070" y2="146" stroke="#00a165" stroke-width="1.4"/><ellipse cx="967.5" cy="110" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="967.5" y="123.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Session history</text><text x="967.5" y="140.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">older messages</text><path d="M865 195 V231 A102.5 15 0 0 0 1070 231 V195" fill="#ecfdf5" stroke="none"/><path d="M865 231 A102.5 15 0 0 0 1070 231" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="865" y1="195" x2="865" y2="231" stroke="#00a165" stroke-width="1.4"/><line x1="1070" y1="195" x2="1070" y2="231" stroke="#00a165" stroke-width="1.4"/><ellipse cx="967.5" cy="195" rx="102.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="967.5" y="208.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Checkpoints</text><text x="967.5" y="225.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">saved as it goes</text><rect x="865" y="265" width="205" height="66" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="856" y="275" width="9" height="15" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="856" y="303" width="9" height="15" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="967.5" y="292.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Tools</text><text x="967.5" y="309.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what it may call</text><path d="M865 128 H835 M865 213 H835 M865 298 H835" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4"/><path d="M835 128 V378 H522" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#react-arr-a)"/><rect x="616.4" y="352" width="127.2" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="680" y="364" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">it reads and saves</text></svg>