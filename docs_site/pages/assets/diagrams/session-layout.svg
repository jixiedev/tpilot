<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="sess-t sess-d"><title id="sess-t">One session over time</title><desc id="sess-d">A session is a conversation. Each turn is answered, approved and then saved, so a later turn — or a later process — can pick up where the last one stopped.</desc><defs><pattern id="sess-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="sess-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="sess-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="sess-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="sess-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#sess-grid)"/><rect width="100%" height="100%" fill="url(#sess-glow)"/><path d="M80 111.6 C220 49.6 380 173.60000000000002 520 99.2" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 446.4 C860 508.4 700 359.59999999999997 500 483.6" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 580 V592 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 580 V592 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="360" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">ONE TURN</text><circle cx="110.0" cy="102" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M110.0 110 V136" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M97.0 118 H123.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M110.0 136 L99.0 154" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M110.0 136 L121.0 154" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="110.0" y="192.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><rect x="200" y="75" width="230" height="62" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="315.0" y="100.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">You ask a question</text><text x="315.0" y="117.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the turn begins</text><rect x="200" y="155" width="230" height="62" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="315.0" y="180.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The agent works</text><text x="315.0" y="197.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one step at a time</text><path d="M315.0 235 L430 270.0 L315.0 305 L200 270.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="315.0" y="264.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Do you approve?</text><text x="315.0" y="281.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the gate waits for you</text><rect x="200" y="325" width="230" height="62" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="315.0" y="350.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The answer comes back</text><text x="315.0" y="367.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">plain text, same session</text><path d="M500 105 V195 A120.0 15 0 0 0 740 195 V105" fill="#ecfdf5" stroke="none"/><path d="M500 195 A120.0 15 0 0 0 740 195" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="500" y1="105" x2="500" y2="195" stroke="#00a165" stroke-width="1.4"/><line x1="740" y1="105" x2="740" y2="195" stroke="#00a165" stroke-width="1.4"/><ellipse cx="620.0" cy="105" rx="120.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="620.0" y="145.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Session checkpoints</text><text x="620.0" y="162.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one per session</text><path d="M125 118 C155 118 165 104 198 104" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#sess-arr-a)"/><path d="M125 145 C165 205 170 250 198 265" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#sess-arr-a)"/><rect x="98.8" y="200" width="82.4" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="140" y="212" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">you approve</text><circle cx="315" cy="137" r="2.4" fill="#00a165"/><line x1="315" y1="137" x2="315" y2="153" stroke="#00a165" stroke-width="1.6" marker-end="url(#sess-arr-a)"/><circle cx="315" cy="217" r="2.4" fill="#00a165"/><line x1="315" y1="217" x2="315" y2="233" stroke="#00a165" stroke-width="1.6" marker-end="url(#sess-arr-a)"/><circle cx="315" cy="305" r="2.4" fill="#00a165"/><line x1="315" y1="305" x2="315" y2="323" stroke="#00a165" stroke-width="1.6" marker-end="url(#sess-arr-a)"/><path d="M432 186 C462 186 462 145 498 145" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#sess-arr-a)"/><rect x="443.0" y="150" width="44.0" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="465" y="162" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">saved</text><rect x="30" y="440" width="800" height="140" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="430" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">AND LATER</text><rect x="200" y="465" width="230" height="62" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="315.0" y="490.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">You ask again</text><text x="315.0" y="507.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the session resumes</text><path d="M620 212 V425 H315 V463" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#sess-arr-a)"/><rect x="403.2" y="403" width="133.60000000000002" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="470" y="415" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the session resumes</text><path d="M198 496 H150 C118 496 118 132 190 128" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#sess-arr-a)"/><rect x="62.8" y="318" width="114.4" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="120" y="330" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the same session</text><rect x="850" y="45" width="240" height="535" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">ABOUT A SESSION</text><path d="M868 90 H1053 L1068 105 V186 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 90 V105 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="132.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">One conversation</text><text x="968.0" y="149.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">with its own history</text><path d="M868 210 H1053 L1068 225 V306 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 210 V225 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="252.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Saved as it happens</text><text x="968.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">not only at the end</text><path d="M868 330 H1053 L1068 345 V426 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 330 V345 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">A restart continues</text><text x="968.0" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">from the last checkpoint</text><circle cx="868" cy="460" r="7" fill="#334155"/><circle cx="868" cy="460" r="3.2" fill="#ffffff"/><text x="882" y="464" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">name it and come back</text></svg>