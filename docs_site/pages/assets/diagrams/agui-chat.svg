<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="achat-t achat-d"><title id="achat-t">The browser chat</title><desc id="achat-d">Your message becomes one streaming request. Every event that comes back turns into a card in the chat, or an update in the panel beside it.</desc><defs><pattern id="achat-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="achat-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="achat-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="achat-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="achat-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#achat-grid)"/><rect width="100%" height="100%" fill="url(#achat-glow)"/><path d="M80 115.19999999999999 C220 51.2 380 179.20000000000002 520 102.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 460.79999999999995 C860 524.8 700 371.2 500 499.20000000000005" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 600 V612 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 600 V612 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="60" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="50" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">IN THE BROWSER</text><circle cx="89.0" cy="86" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M89.0 94 V120" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M76.0 102 H102.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 120 L78.0 138" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 120 L100.0 138" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="89.0" y="151.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><rect x="150" y="68" width="235" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="78" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="124" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="267.5" y="110.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Chat panel</text><text x="267.5" y="127.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your messages, and the tool cards</text><rect x="415" y="68" width="235" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="406" y="78" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="406" y="124" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="532.5" y="110.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Working state panel</text><text x="532.5" y="127.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">tables, draft query, results</text><rect x="30" y="215" width="800" height="110" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="205" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">ON THE SERVER</text><path d="M150 234 L162 222 H362 L350 234 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M350 234 L362 222 V314 L350 326 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="150" y="234" width="200" height="92" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="250.0" y="274.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Next.js</text><text x="250.0" y="291.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the web front end</text><path d="M390 234 L402 222 H602 L590 234 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M590 234 L602 222 V314 L590 326 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="390" y="234" width="200" height="92" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="490.0" y="274.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">AG-UI server</text><text x="490.0" y="291.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">streams the events</text><path d="M630 225 H804 L820 267.5 L804 310 H630 Z" fill="#f2fbf7" stroke="#00875a" stroke-width="1.4"/><text x="717.0" y="261.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Event stream</text><text x="717.0" y="278.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one event at a time</text><rect x="30" y="360" width="800" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="350" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE AGENT</text><rect x="150" y="368" width="235" height="98" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="378" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="425" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="267.5" y="411.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The databot agent</text><text x="267.5" y="428.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">asks, calls tools, answers</text><rect x="415" y="368" width="190" height="98" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="406" y="378" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="406" y="425" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="510.0" y="411.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Its tools</text><text x="510.0" y="428.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">read-only by default</text><path d="M635 377 V452 A95.0 15 0 0 0 825 452 V377" fill="#ecfdf5" stroke="none"/><path d="M635 452 A95.0 15 0 0 0 825 452" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="635" y1="377" x2="635" y2="452" stroke="#00a165" stroke-width="1.4"/><line x1="825" y1="377" x2="825" y2="452" stroke="#00a165" stroke-width="1.4"/><ellipse cx="730.0" cy="377" rx="95.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="730.0" y="410.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Paused work</text><text x="730.0" y="427.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the checkpoint it writes</text><rect x="30" y="510" width="800" height="90" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="500" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT YOU END UP WITH</text><path d="M150 518 H370 L385 533 V592 H150 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M370 518 V533 H385" fill="none" stroke="#334155" stroke-width="1.3"/><text x="267.5" y="549.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The answer</text><text x="267.5" y="566.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">grounded in your own material</text><path d="M415 518 H635 L650 533 V592 H415 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M635 518 V533 H650" fill="none" stroke="#334155" stroke-width="1.3"/><text x="532.5" y="549.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">An error, if it fails</text><text x="532.5" y="566.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what went wrong, in the chat</text><circle cx="126" cy="118" r="2.4" fill="#00a165"/><line x1="126" y1="118" x2="148" y2="118" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><circle cx="267" cy="164" r="2.4" fill="#00a165"/><line x1="267" y1="164" x2="267" y2="220" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><circle cx="364" cy="280" r="2.4" fill="#00a165"/><line x1="364" y1="280" x2="388" y2="280" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><circle cx="490" cy="326" r="2.4" fill="#00a165"/><line x1="490" y1="326" x2="490" y2="366" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><circle cx="385" cy="417" r="2.4" fill="#334155"/><line x1="385" y1="417" x2="413" y2="417" stroke="#334155" stroke-width="1.6" marker-end="url(#achat-arr)"/><circle cx="267" cy="466" r="2.4" fill="#00a165"/><line x1="267" y1="466" x2="267" y2="516" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><path d="M700 221 V118 H654" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#achat-arr-a)"/><rect x="711.6" y="128" width="120.80000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="772" y="140" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">the working state</text><path d="M640 221 C560 195 420 180 334 168" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#achat-arr-a)"/><rect x="514.0" y="178" width="172.0" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="600" y="190" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">each event becomes a card</text><circle cx="40" cy="620" r="7" fill="#334155"/><circle cx="40" cy="620" r="3.2" fill="#ffffff"/><text x="54" y="624" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">Every stream ends with a clear outcome: finished, or failed.</text></svg>