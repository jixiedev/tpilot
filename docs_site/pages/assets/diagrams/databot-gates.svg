<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 565" role="img" aria-labelledby="dbgates-t dbgates-d"><title id="dbgates-t">What happens at a gate</title><desc id="dbgates-d">At a gate you can approve, send the stage back with comments, stop, or preview it, and a rejection repeats only that stage.</desc><defs><pattern id="dbgates-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="dbgates-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="dbgates-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="dbgates-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="dbgates-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#dbgates-grid)"/><rect width="100%" height="100%" fill="url(#dbgates-glow)"/><path d="M80 101.7 C220 45.2 380 158.20000000000002 520 90.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 406.8 C860 463.29999999999995 700 327.7 500 440.7" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 525 V537 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 525 V537 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="760" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT YOU REVIEW</text><rect x="60" y="62" width="235" height="85" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="177.5" y="98.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The stage's work</text><text x="177.5" y="115.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">models, or a drafted query</text><path d="M340 62 H530 V135 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 L340 135 Z" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="435.0" y="92.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">What you see</text><text x="435.0" y="109.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">before it goes on</text><path d="M677.5 58 L775 105.5 L677.5 153 L580 105.5 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="677.5" y="99.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Your decision</text><text x="677.5" y="116.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">waits for you</text><rect x="30" y="225" width="760" height="135" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="215" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">YOUR FOUR ANSWERS</text><rect x="60" y="245" width="150" height="85" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="135.0" y="281.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Approve</text><text x="135.0" y="298.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">move on to the next stage</text><rect x="240" y="245" width="130" height="85" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="305.0" y="281.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Stop</text><text x="305.0" y="298.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">end the turn here</text><rect x="400" y="245" width="145" height="85" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="472.5" y="281.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Preview</text><text x="472.5" y="298.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">nothing is kept</text><rect x="575" y="245" width="200" height="85" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="675.0" y="281.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Send back with comments</text><text x="675.0" y="298.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">redo this stage with your notes</text><rect x="30" y="395" width="760" height="135" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="385" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT HAPPENS NEXT</text><path d="M60 405 H195 L210 420 V490 H60 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M195 405 V420 H210" fill="none" stroke="#334155" stroke-width="1.3"/><text x="135.0" y="441.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Stage confirmed</text><text x="135.0" y="458.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the pipeline moves on</text><path d="M240 405 H355 L370 420 V490 H240 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M355 405 V420 H370" fill="none" stroke="#334155" stroke-width="1.3"/><text x="305.0" y="441.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The turn ends</text><text x="305.0" y="458.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">nothing is kept</text><path d="M400 405 H530 L545 420 V490 H400 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M530 405 V420 H545" fill="none" stroke="#334155" stroke-width="1.3"/><text x="472.5" y="441.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Preview only</text><text x="472.5" y="458.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">nothing is written</text><path d="M575 405 H760 L775 420 V490 H575 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M760 405 V420 H775" fill="none" stroke="#334155" stroke-width="1.3"/><text x="675.0" y="441.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The stage is repeated</text><text x="675.0" y="458.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">with your comments attached</text><circle cx="297" cy="105" r="2.4" fill="#00a165"/><line x1="297" y1="105" x2="338" y2="105" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="532" cy="105" r="2.4" fill="#00a165"/><line x1="532" y1="105" x2="578" y2="105" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><path d="M677 155 V173" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="135" cy="175" r="2.4" fill="#00a165"/><line x1="135" y1="175" x2="678" y2="175" stroke="#00a165" stroke-width="1.6"/><circle cx="135" cy="175" r="2.4" fill="#00a165"/><line x1="135" y1="175" x2="135" y2="243" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="305" cy="175" r="2.4" fill="#00a165"/><line x1="305" y1="175" x2="305" y2="243" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="472" cy="175" r="2.4" fill="#00a165"/><line x1="472" y1="175" x2="472" y2="243" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="675" cy="175" r="2.4" fill="#00a165"/><line x1="675" y1="175" x2="675" y2="243" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="135" cy="332" r="2.4" fill="#00a165"/><line x1="135" y1="332" x2="135" y2="403" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="305" cy="332" r="2.4" fill="#00a165"/><line x1="305" y1="332" x2="305" y2="403" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="472" cy="332" r="2.4" fill="#00a165"/><line x1="472" y1="332" x2="472" y2="403" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><circle cx="675" cy="332" r="2.4" fill="#00a165"/><line x1="675" y1="332" x2="675" y2="403" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbgates-arr-a)"/><path d="M675 492 V512 H42 V105 H58" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dbgates-arr-a)"/><rect x="257.6" y="500" width="184.8" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="350" y="512" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">sent back to the same stage</text><rect x="810" y="45" width="280" height="485" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">AT BOTH GATES</text><rect x="832" y="92" width="236" height="48" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="102" width="9" height="11" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="120" width="9" height="11" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="950.0" y="110.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Review the models</text><text x="950.0" y="127.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">after the models are chosen</text><rect x="832" y="152" width="236" height="48" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="162" width="9" height="11" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="823" y="180" width="9" height="11" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="950.0" y="170.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Review the query</text><text x="950.0" y="187.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">after the query is drafted</text><path d="M832 225 H1053 L1068 240 V325 H832 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 225 V240 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="950.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The same four answers</text><text x="950.0" y="286.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">at both gates</text><circle cx="40" cy="550" r="7" fill="#334155"/><circle cx="40" cy="550" r="3.2" fill="#ffffff"/><text x="54" y="554" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">A rejection repeats one stage, not the whole flow.</text></svg>