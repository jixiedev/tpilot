<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="memlay-t memlay-d"><title id="memlay-t">What the platform keeps</title><desc id="memlay-d">A window holds what is in play right now: the instructions, your profile, the recent turns and the newest tool results. Everything that leaves the window is written to disk first, in one of four stores.</desc><defs><pattern id="memlay-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="memlay-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="memlay-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="memlay-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="memlay-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#memlay-grid)"/><rect width="100%" height="100%" fill="url(#memlay-glow)"/><path d="M80 108.0 C220 48.0 380 168.00000000000003 520 96.0" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 432.0 C860 491.99999999999994 700 348.0 500 468.0" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 560 V572 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 560 V572 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="195" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">IN PLAY RIGHT NOW</text><rect x="60" y="68" width="740" height="155" rx="12" fill="#ffffff" stroke="#0b1220" stroke-width="1.6" filter="url(#memlay-lift)"/><rect x="60" y="68" width="740" height="34" rx="12" fill="#f2fbf7"/><rect x="60" y="90" width="740" height="12" fill="#f2fbf7"/><line x1="60" y1="102" x2="800" y2="102" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><circle cx="80" cy="85" r="4" fill="rgba(0,135,90,0.35)"/><circle cx="94" cy="85" r="4" fill="rgba(0,135,90,0.22)"/><text x="112" y="90" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">the window</text><circle cx="83" cy="124.5" r="4.5" fill="rgba(0,135,90,0.160)"/><rect x="94" y="120" width="366.08000000000004" height="9" rx="4.5" fill="rgba(15,23,42,0.100)"/><circle cx="83" cy="141.5" r="4.5" fill="rgba(0,135,90,0.140)"/><rect x="94" y="137" width="267.52" height="9" rx="4.5" fill="rgba(15,23,42,0.080)"/><rect x="78" y="161" width="126.72" height="30" rx="4" fill="#e8f8f0" stroke="rgba(0,135,90,0.30)" stroke-width="1"/><text x="141.36" y="180" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0b1220">instructions</text><rect x="204.72" y="161" width="112.64" height="30" rx="4" fill="#dcf7ea" stroke="rgba(0,135,90,0.30)" stroke-width="1"/><text x="261.04" y="180" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0b1220">your profile</text><rect x="317.36" y="161" width="197.12" height="30" rx="4" fill="#f2fbf7" stroke="rgba(0,135,90,0.30)" stroke-width="1"/><text x="415.92" y="180" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0b1220">recent turns</text><rect x="514.48" y="161" width="267.52" height="30" rx="4" fill="#ffffff" stroke="rgba(0,135,90,0.30)" stroke-width="1"/><text x="648.24" y="180" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0b1220">tool results</text><text x="78" y="209" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">older messages fade out first</text><rect x="30" y="265" width="800" height="195" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="255" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHERE EVERYTHING ELSE GOES</text><path d="M60 320 V415 A87.5 15 0 0 0 235 415 V320" fill="#ecfdf5" stroke="none"/><path d="M60 415 A87.5 15 0 0 0 235 415" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="60" y1="320" x2="60" y2="415" stroke="#00a165" stroke-width="1.4"/><line x1="235" y1="320" x2="235" y2="415" stroke="#00a165" stroke-width="1.4"/><ellipse cx="147.5" cy="320" rx="87.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="147.5" y="363.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Offload store</text><text x="147.5" y="380.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">large tool results</text><path d="M250 320 V415 A87.5 15 0 0 0 425 415 V320" fill="#ecfdf5" stroke="none"/><path d="M250 415 A87.5 15 0 0 0 425 415" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="250" y1="320" x2="250" y2="415" stroke="#00a165" stroke-width="1.4"/><line x1="425" y1="320" x2="425" y2="415" stroke="#00a165" stroke-width="1.4"/><ellipse cx="337.5" cy="320" rx="87.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="337.5" y="363.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The archive</text><text x="337.5" y="380.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what leaves the window</text><path d="M440 320 V415 A87.5 15 0 0 0 615 415 V320" fill="#ecfdf5" stroke="none"/><path d="M440 415 A87.5 15 0 0 0 615 415" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="440" y1="320" x2="440" y2="415" stroke="#00a165" stroke-width="1.4"/><line x1="615" y1="320" x2="615" y2="415" stroke="#00a165" stroke-width="1.4"/><ellipse cx="527.5" cy="320" rx="87.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="527.5" y="363.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Profile store</text><text x="527.5" y="380.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one record per person</text><path d="M630 320 V415 A87.5 15 0 0 0 805 415 V320" fill="#ecfdf5" stroke="none"/><path d="M630 415 A87.5 15 0 0 0 805 415" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="630" y1="320" x2="630" y2="415" stroke="#00a165" stroke-width="1.4"/><line x1="805" y1="320" x2="805" y2="415" stroke="#00a165" stroke-width="1.4"/><ellipse cx="717.5" cy="320" rx="87.5" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="717.5" y="363.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">Session checkpoints</text><text x="717.5" y="380.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a session survives a restart</text><circle cx="140" cy="225" r="2.4" fill="#00a165"/><line x1="140" y1="225" x2="140" y2="300" stroke="#00a165" stroke-width="1.6" marker-end="url(#memlay-arr-a)"/><circle cx="330" cy="225" r="2.4" fill="#00a165"/><line x1="330" y1="225" x2="330" y2="300" stroke="#00a165" stroke-width="1.6" marker-end="url(#memlay-arr-a)"/><rect x="266.4" y="240" width="127.2" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="330" y="252" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">written here first</text><path d="M527 225 V300" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#memlay-arr-a)"/><circle cx="717" cy="225" r="2.4" fill="#00a165"/><line x1="717" y1="225" x2="717" y2="300" stroke="#00a165" stroke-width="1.6" marker-end="url(#memlay-arr-a)"/><rect x="850" y="45" width="240" height="515" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">THE RULES</text><path d="M868 90 H1053 L1068 105 V186 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 90 V105 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="132.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Nothing leaves unwritten</text><text x="968.0" y="149.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the archive is written first</text><path d="M868 210 H1053 L1068 225 V306 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 210 V225 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="252.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Big results move out early</text><text x="968.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">a pointer stays in place</text><path d="M868 330 H1053 L1068 345 V426 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 330 V345 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Old turns are folded</text><text x="968.0" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the shape of it is kept</text><circle cx="868" cy="460" r="7" fill="#334155"/><circle cx="868" cy="460" r="3.2" fill="#ffffff"/><text x="882" y="464" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">the window is finite</text><circle cx="868" cy="500" r="7" fill="#334155"/><circle cx="868" cy="500" r="3.2" fill="#ffffff"/><text x="882" y="504" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">nothing is lost</text></svg>