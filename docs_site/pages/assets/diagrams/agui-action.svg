<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="aact-t aact-d"><title id="aact-t">Editing a draft before it runs</title><desc id="aact-d">An edit in the panel is written straight into the paused work. Only the drafts the current stage owns can be changed.</desc><defs><pattern id="aact-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="aact-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="aact-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="aact-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="aact-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#aact-grid)"/><rect width="100%" height="100%" fill="url(#aact-glow)"/><path d="M80 97.2 C220 43.2 380 151.20000000000002 520 86.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 388.8 C860 442.79999999999995 700 313.2 500 421.2" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 500 V512 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 500 V512 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="50" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="40" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">IN THE BROWSER</text><circle cx="89.0" cy="72" r="8" fill="#ffffff" stroke="#0b1220" stroke-width="1.8"/><path d="M89.0 80 V106" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M76.0 88 H102.0" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 106 L78.0 124" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M89.0 106 L100.0 124" stroke="#0b1220" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="89.0" y="139.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">You</text><rect x="150" y="58" width="290" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="68" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="141" y="114" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="295.0" y="100.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The panel</text><text x="295.0" y="117.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">pick the tables, edit the drafted query</text><path d="M490 60 H715 L730 75 V152 H490 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M715 60 V75 H730" fill="none" stroke="#334155" stroke-width="1.3"/><text x="610.0" y="100.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Not a chat message</text><text x="610.0" y="117.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the edit goes straight to the paused work</text><rect x="30" y="215" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="205" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">HOW THE CHANGE IS APPLIED</text><path d="M150 234 L162 222 H362 L350 234 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M350 234 L362 222 V314 L350 326 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="150" y="234" width="200" height="92" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="250.0" y="274.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The web front end</text><text x="250.0" y="291.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">Next.js</text><path d="M385 234 L397 222 H612 L600 234 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><path d="M600 234 L612 222 V314 L600 326 Z" fill="#c7dcf0" stroke="#15467d" stroke-width="1.4"/><rect x="385" y="234" width="215" height="92" rx="3" fill="#dbe9f7" stroke="#15467d" stroke-width="1.4"/><text x="492.5" y="274.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The AG-UI server</text><text x="492.5" y="291.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">checks the stage</text><rect x="30" y="380" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="370" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT HAPPENS NEXT</text><path d="M150 388 H325 L340 403 V484 H150 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M325 388 V403 H340" fill="none" stroke="#334155" stroke-width="1.3"/><text x="245.0" y="430.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The platform refuses</text><text x="245.0" y="447.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">this stage does not own the draft</text><path d="M465.0 386 L555 435.0 L465.0 484 L375 435.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="465.0" y="429.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Allowed here?</text><text x="465.0" y="446.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the stage must own it</text><rect x="590" y="388" width="240" height="96" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="581" y="398" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="581" y="444" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="710.0" y="430.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The paused work is updated</text><text x="710.0" y="447.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your edit goes in place</text><circle cx="126" cy="110" r="2.4" fill="#00a165"/><line x1="126" y1="110" x2="148" y2="110" stroke="#00a165" stroke-width="1.6" marker-end="url(#aact-arr-a)"/><circle cx="440" cy="106" r="2.4" fill="#334155"/><line x1="440" y1="106" x2="488" y2="106" stroke="#334155" stroke-width="1.6" marker-end="url(#aact-arr)"/><circle cx="295" cy="154" r="2.4" fill="#00a165"/><line x1="295" y1="154" x2="295" y2="220" stroke="#00a165" stroke-width="1.6" marker-end="url(#aact-arr-a)"/><circle cx="364" cy="280" r="2.4" fill="#00a165"/><line x1="364" y1="280" x2="383" y2="280" stroke="#00a165" stroke-width="1.6" marker-end="url(#aact-arr-a)"/><path d="M492 328 V352 H465 V384" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#aact-arr-a)"/><circle cx="373" cy="435" r="2.4" fill="#334155"/><line x1="373" y1="435" x2="342" y2="435" stroke="#334155" stroke-width="1.6" marker-end="url(#aact-arr)"/><rect x="343.0" y="400" width="28" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="357" y="412" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">no</text><circle cx="555" cy="435" r="2.4" fill="#00a165"/><line x1="555" y1="435" x2="588" y2="435" stroke="#00a165" stroke-width="1.6" marker-end="url(#aact-arr-a)"/><rect x="556.4" y="400" width="31.200000000000003" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="572" y="412" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">yes</text><circle cx="40" cy="520" r="7" fill="#334155"/><circle cx="40" cy="520" r="3.2" fill="#ffffff"/><text x="54" y="524" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">Only the drafts that belong to the current stage can be edited.</text><rect x="850" y="50" width="240" height="290" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="80" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT YOU CAN EDIT</text><rect x="872" y="100" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="110" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="127" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="123.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The selected tables</text><rect x="872" y="162" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="172" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="189" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="185.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The drafted query</text><rect x="872" y="224" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="234" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="251" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="247.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Ask for a new draft</text></svg>