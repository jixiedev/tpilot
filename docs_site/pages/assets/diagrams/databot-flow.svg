<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="dbflow-t dbflow-d"><title id="dbflow-t">The stages of a data question</title><desc id="dbflow-d">Five stages: find the models, review them, draft the query, review it, then run it. Two of the stages stop and wait for you.</desc><defs><pattern id="dbflow-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="dbflow-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="dbflow-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="dbflow-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="dbflow-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#dbflow-grid)"/><rect width="100%" height="100%" fill="url(#dbflow-glow)"/><path d="M80 106.2 C220 47.2 380 165.20000000000002 520 94.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 424.8 C860 483.79999999999995 700 342.2 500 460.2" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 550 V562 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 550 V562 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="760" height="150" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">FINDING THE MODELS</text><rect x="60" y="70" width="225" height="100" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="80" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="128" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="172.5" y="114.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Find the models</text><text x="172.5" y="131.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">looks for the models that fit</text><path d="M330 70 H520 V158 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 L330 158 Z" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="425.0" y="108.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The selected models</text><text x="425.0" y="125.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the candidates it found</text><path d="M667.5 68 L775 119.0 L667.5 170 L560 119.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="667.5" y="113.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Review the models</text><text x="667.5" y="130.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">you approve or send back</text><rect x="30" y="225" width="760" height="150" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="215" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WRITING AND RUNNING THE QUERY</text><rect x="60" y="250" width="225" height="100" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="260" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="308" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="172.5" y="294.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Draft the query</text><text x="172.5" y="311.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the agent writes the SQL</text><path d="M330 250 H520 V338 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 L330 338 Z" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="425.0" y="288.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The drafted query</text><text x="425.0" y="305.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">and why it looks that way</text><path d="M667.5 248 L775 299.0 L667.5 350 L560 299.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="667.5" y="293.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Review the query</text><text x="667.5" y="310.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">approve, or ask again</text><rect x="30" y="405" width="760" height="150" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="790" y="395" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">RUNNING THE QUERY</text><rect x="60" y="430" width="225" height="100" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="440" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="51" y="488" width="9" height="22" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="172.5" y="474.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Run the query</text><text x="172.5" y="491.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">read-only, with a row limit</text><path d="M379.4 530 a32.300000000000004 30.0 0 0 1 3.8000000000000003 -42.0 a45.6 36.0 0 0 1 83.6 -14.000000000000002 a38.0 28.000000000000004 0 0 1 57.0 56.00000000000001 Z" fill="#eef4fb" stroke="#15467d" stroke-width="1.4"/><text x="425.0" y="491.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Trino</text><text x="425.0" y="508.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your warehouse</text><path d="M560 430 H760 L775 445 V530 H560 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M760 430 V445 H775" fill="none" stroke="#334155" stroke-width="1.3"/><text x="667.5" y="474.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The answer</text><text x="667.5" y="491.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what the agent tells you</text><circle cx="287" cy="120" r="2.4" fill="#00a165"/><line x1="287" y1="120" x2="328" y2="120" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><circle cx="522" cy="120" r="2.4" fill="#00a165"/><line x1="522" y1="120" x2="558" y2="120" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><path d="M667 172 C667 210 172 200 172 248" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><rect x="368.4" y="196" width="63.2" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="400" y="208" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">approved</text><circle cx="287" cy="300" r="2.4" fill="#00a165"/><line x1="287" y1="300" x2="328" y2="300" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><circle cx="522" cy="300" r="2.4" fill="#00a165"/><line x1="522" y1="300" x2="558" y2="300" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><path d="M667 352 C667 390 172 380 172 428" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><rect x="368.4" y="376" width="63.2" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="400" y="388" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">approved</text><circle cx="287" cy="480" r="2.4" fill="#00a165"/><line x1="287" y1="480" x2="328" y2="480" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><circle cx="522" cy="480" r="2.4" fill="#00a165"/><line x1="522" y1="480" x2="558" y2="480" stroke="#00a165" stroke-width="1.6" marker-end="url(#dbflow-arr-a)"/><rect x="810" y="45" width="280" height="510" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHAT IT READS</text><path d="M893.36 191 a40.120000000000005 28.799999999999997 0 0 1 4.72 -40.32 a56.64 34.56 0 0 1 103.84 -13.440000000000001 a47.2 26.880000000000003 0 0 1 70.8 53.760000000000005 Z" fill="#eef4fb" stroke="#15467d" stroke-width="1.4"/><text x="950.0" y="153.32" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Catalog</text><text x="950.0" y="170.32" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the models you own</text><path d="M832 220 V286 A118.0 15 0 0 0 1068 286 V220" fill="#ecfdf5" stroke="none"/><path d="M832 286 A118.0 15 0 0 0 1068 286" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="832" y1="220" x2="832" y2="286" stroke="#00a165" stroke-width="1.4"/><line x1="1068" y1="220" x2="1068" y2="286" stroke="#00a165" stroke-width="1.4"/><ellipse cx="950.0" cy="220" rx="118.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="950.0" y="248.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The knowledge base</text><text x="950.0" y="265.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your notes and tickets</text><path d="M893.36 411 a40.120000000000005 28.799999999999997 0 0 1 4.72 -40.32 a56.64 34.56 0 0 1 103.84 -13.440000000000001 a47.2 26.880000000000003 0 0 1 70.8 53.760000000000005 Z" fill="#eef4fb" stroke="#15467d" stroke-width="1.4"/><text x="950.0" y="373.32" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Metadata</text><text x="950.0" y="390.32" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what your tables contain</text><path d="M832 425 H1053 L1068 440 V515 H832 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 425 V440 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="950.0" y="464.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Everything is read-only</text><text x="950.0" y="481.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">your data is never changed</text><circle cx="40" cy="575" r="7" fill="#334155"/><circle cx="40" cy="575" r="3.2" fill="#ffffff"/><text x="54" y="579" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">Nothing reaches the warehouse before both gates are approved.</text></svg>