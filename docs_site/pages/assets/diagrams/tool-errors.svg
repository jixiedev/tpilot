<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="terr-t terr-d"><title id="terr-t">What happens when a tool call fails</title><desc id="terr-d">A failed call is classified, retried once when the failure looks transient, and handed back to the agent as a structured result.</desc><defs><pattern id="terr-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="terr-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="terr-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="terr-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="terr-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#terr-grid)"/><rect width="100%" height="100%" fill="url(#terr-glow)"/><path d="M80 97.2 C220 43.2 380 151.20000000000002 520 86.4" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 388.8 C860 442.79999999999995 700 313.2 500 421.2" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 500 V512 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 500 V512 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="50" width="800" height="120" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="40" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHEN A TOOL FAILS</text><rect x="70" y="60" width="165" height="95" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="61" y="70" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="61" y="115" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="152.5" y="101.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The tool</text><text x="152.5" y="118.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">reads your data</text><path d="M265 60 H400 L415 75 V155 H265 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M400 60 V75 H415" fill="none" stroke="#334155" stroke-width="1.3"/><text x="340.0" y="101.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The call fails</text><text x="340.0" y="118.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">an error comes back</text><rect x="445" y="60" width="185" height="95" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="537.5" y="101.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Classify the failure</text><text x="537.5" y="118.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the kind of error</text><path d="M740.0 58 L820 107.0 L740.0 156 L660 107.0 Z" fill="#fff8e1" stroke="#b45309" stroke-width="1.5"/><text x="740.0" y="101.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0b1220">Worth retrying?</text><text x="740.0" y="118.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">connection or timeout</text><rect x="30" y="215" width="800" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="205" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT HAPPENS NEXT</text><rect x="655" y="225" width="165" height="90" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="737.5" y="264.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Try it once more</text><text x="737.5" y="281.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">one retry only</text><rect x="30" y="370" width="800" height="115" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="360" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT THE AGENT GETS BACK</text><path d="M60 380 H325 L340 395 V475 H60 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M325 380 V395 H340" fill="none" stroke="#334155" stroke-width="1.3"/><text x="200.0" y="421.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">A structured result</text><text x="200.0" y="438.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">type, message, hint</text><path d="M370 380 H545 L560 395 V475 H370 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M545 380 V395 H560" fill="none" stroke="#334155" stroke-width="1.3"/><text x="465.0" y="421.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Another tool to try</text><text x="465.0" y="438.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">when one exists</text><rect x="590" y="380" width="210" height="95" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="581" y="390" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="581" y="435" width="9" height="21" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="695.0" y="421.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">The agent</text><text x="695.0" y="438.5" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">it reads it and decides</text><circle cx="235" cy="107" r="2.4" fill="#00a165"/><line x1="235" y1="107" x2="263" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="415" cy="107" r="2.4" fill="#00a165"/><line x1="415" y1="107" x2="443" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="630" cy="107" r="2.4" fill="#00a165"/><line x1="630" y1="107" x2="658" y2="107" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="740" cy="156" r="2.4" fill="#00a165"/><line x1="740" y1="156" x2="740" y2="223" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><rect x="724.4" y="170" width="31.200000000000003" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="740" y="182" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">yes</text><path d="M658 107 C590 190 420 330 284 352" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#terr-arr)"/><rect x="546.0" y="188" width="28" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="560" y="200" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">no</text><path d="M730 317 V345 H284" fill="none" stroke="#334155" stroke-width="1.6"/><circle cx="284" cy="345" r="2.4" fill="#00a165"/><line x1="284" y1="345" x2="284" y2="378" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="340" cy="427" r="2.4" fill="#00a165"/><line x1="340" y1="427" x2="368" y2="427" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="560" cy="427" r="2.4" fill="#00a165"/><line x1="560" y1="427" x2="588" y2="427" stroke="#00a165" stroke-width="1.6" marker-end="url(#terr-arr-a)"/><circle cx="40" cy="515" r="7" fill="#334155"/><circle cx="40" cy="515" r="3.2" fill="#ffffff"/><text x="54" y="519" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">If the retry works, the result comes back as usual.</text><rect x="850" y="50" width="240" height="425" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="80" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">THE KINDS OF FAILURE</text><rect x="872" y="100" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="110" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="127" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="123.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Connection</text><rect x="872" y="162" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="172" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="189" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="185.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Timeout</text><rect x="872" y="224" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="234" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="251" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="247.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Syntax</text><rect x="872" y="286" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="296" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="313" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="309.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Not found</text><rect x="872" y="348" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="358" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="375" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="371.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Permission</text><rect x="872" y="410" width="196" height="46" rx="4" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="420" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><rect x="863" y="437" width="9" height="10" rx="2" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="970.0" y="433.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0b1220">Unknown</text></svg>