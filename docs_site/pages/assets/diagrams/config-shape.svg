<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="cfg-t cfg-d"><title id="cfg-t">Configuration shape</title><desc id="cfg-d">A base layer, a team layer, and one file per agent. Each agent file sets the prompt, run limits, tool set and accepted servers; the surrounding files hold connections, tool groups, the knowledge base, local paths, models and logging.</desc><defs><pattern id="cfg-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="cfg-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="cfg-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="cfg-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="cfg-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#cfg-grid)"/><rect width="100%" height="100%" fill="url(#cfg-glow)"/><path d="M80 111.6 C220 49.6 380 173.60000000000002 520 99.2" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 446.4 C860 508.4 700 359.59999999999997 500 483.6" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 580 V592 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 580 V592 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="140" rx="8" 