<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-labelledby="statelay-t statelay-d"><title id="statelay-t">The state that travels through a turn</title><desc id="statelay-d">One record carries a turn: the conversation so far, which step we are on, the counters, the plan and what we know about you. It is saved after every step.</desc><defs><pattern id="statelay-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,135,90,0.08)" stroke-width="1"/></pattern><radialGradient id="statelay-glow" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="rgba(0,161,101,0.10)"/><stop offset="100%" stop-color="rgba(247,251,249,0)"/></radialGradient><filter id="statelay-lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0b1220" flood-opacity="0.12"/></filter><marker id="statelay-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#334155"/></marker><marker id="statelay-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00a165"/></marker></defs><rect width="100%" height="100%" fill="#f7fbf9"/><rect width="100%" height="100%" fill="url(#statelay-grid)"/><rect width="100%" height="100%" fill="url(#statelay-glow)"/><path d="M80 104.39999999999999 C220 46.4 380 162.4 520 92.8" fill="none" stroke="rgba(0,161,101,0.16)" stroke-width="1.2"/><path d="M1030 417.59999999999997 C860 475.59999999999997 700 336.4 500 452.40000000000003" fill="none" stroke="rgba(0,161,101,0.14)" stroke-width="1.2"/><path d="M24 40 V28 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 40 V28 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M24 540 V552 H36" fill="none" stroke="#00a165" stroke-width="1.6"/><path d="M1096 540 V552 H1084" fill="none" stroke="#00a165" stroke-width="1.6"/><rect x="30" y="45" width="800" height="215" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="35" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">THE RECORD</text><path d="M60 68 H340 V216 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 q-6.0 12 -12 0 L60 216 Z" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="200.0" y="136.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The turn record</text><text x="200.0" y="153.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what every step sees</text><rect x="80" y="76" width="135.60000000000002" height="13" rx="2" fill="#ffffff" stroke="rgba(0,135,90,0.40)" stroke-width="0.8"/><text x="147.8" y="86" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.05em" fill="#334155">one record per turn</text><text x="380" y="92" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">WHAT IT CARRIES</text><circle cx="380" cy="125" r="7" fill="#334155"/><circle cx="380" cy="125" r="3.2" fill="#ffffff"/><text x="394" y="129" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">the conversation so far</text><circle cx="380" cy="153" r="7" fill="#334155"/><circle cx="380" cy="153" r="3.2" fill="#ffffff"/><text x="394" y="157" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">which step we are on</text><circle cx="380" cy="181" r="7" fill="#334155"/><circle cx="380" cy="181" r="3.2" fill="#ffffff"/><text x="394" y="185" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">the counters: calls and rounds</text><circle cx="380" cy="209" r="7" fill="#334155"/><circle cx="380" cy="209" r="3.2" fill="#ffffff"/><text x="394" y="213" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">the plan and its steps</text><circle cx="380" cy="237" r="7" fill="#334155"/><circle cx="380" cy="237" r="3.2" fill="#ffffff"/><text x="394" y="241" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">what we know about you</text><rect x="30" y="290" width="800" height="180" rx="8" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="830" y="280" text-anchor="end" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#5f6f80">READ AND WRITTEN BACK</text><rect x="60" y="330" width="200" height="68" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="160.0" y="358.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">A step runs</text><text x="160.0" y="375.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">it reads the record</text><rect x="300" y="330" width="200" height="68" rx="9" fill="#ffffff" stroke="#0b1220" stroke-width="1.4"/><text x="400.0" y="358.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The step finishes</text><text x="400.0" y="375.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the record changes</text><path d="M560 335 V420 A115.0 15 0 0 0 790 420 V335" fill="#ecfdf5" stroke="none"/><path d="M560 420 A115.0 15 0 0 0 790 420" fill="none" stroke="#00a165" stroke-width="1.4"/><line x1="560" y1="335" x2="560" y2="420" stroke="#00a165" stroke-width="1.4"/><line x1="790" y1="335" x2="790" y2="420" stroke="#00a165" stroke-width="1.4"/><ellipse cx="675.0" cy="335" rx="115.0" ry="15" fill="#f4fbf8" stroke="#00a165" stroke-width="1.4"/><text x="675.0" y="373.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0b1220">The checkpoint</text><text x="675.0" y="390.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the record, saved</text><path d="M200 230 C200 282 150 288 150 328" fill="none" stroke="#00a165" stroke-width="1.6" marker-end="url(#statelay-arr-a)"/><rect x="150.0" y="276" width="44.0" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="172" y="288" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">reads</text><circle cx="262" cy="364" r="2.4" fill="#00a165"/><line x1="262" y1="364" x2="298" y2="364" stroke="#00a165" stroke-width="1.6" marker-end="url(#statelay-arr-a)"/><circle cx="502" cy="364" r="2.4" fill="#00a165"/><line x1="502" y1="364" x2="558" y2="364" stroke="#00a165" stroke-width="1.6" marker-end="url(#statelay-arr-a)"/><rect x="504.8" y="328" width="50.400000000000006" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="530" y="340" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">writes</text><path d="M655 318 C655 288 420 296 300 230" fill="none" stroke="#00a165" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#statelay-arr-a)"/><rect x="455.6" y="280" width="88.80000000000001" height="16" rx="3" fill="#f7fbf9" stroke="rgba(0,135,90,0.22)"/><text x="500" y="292" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.06em" fill="#334155">loaded again</text><rect x="850" y="45" width="240" height="495" rx="10" fill="#ffffff" stroke="rgba(0,135,90,0.28)" stroke-width="1.2"/><text x="870" y="75" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5f6f80">WHY IT IS SAVED</text><path d="M868 90 H1053 L1068 105 V186 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 90 V105 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="132.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">One record per turn</text><text x="968.0" y="149.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">the same one all the way</text><path d="M868 210 H1053 L1068 225 V306 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 210 V225 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="252.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">The step decides</text><text x="968.0" y="269.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">what happens next is read from it</text><path d="M868 330 H1053 L1068 345 V426 H868 Z" fill="#eef2f7" stroke="#334155" stroke-width="1.3"/><path d="M1053 330 V345 H1068" fill="none" stroke="#334155" stroke-width="1.3"/><text x="968.0" y="372.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b1220">Never only in memory</text><text x="968.0" y="389.0" text-anchor="middle" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#5f6f80">it is saved after every step</text><circle cx="868" cy="470" r="7" fill="#334155"/><circle cx="868" cy="470" r="3.2" fill="#ffffff"/><text x="882" y="474" font-family="Outfit, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#334155">a restart resumes the turn</text></svg>