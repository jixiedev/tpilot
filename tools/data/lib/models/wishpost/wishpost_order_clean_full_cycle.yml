    derived_semantics:
      dimensions:
        - name: is_delivered
          type: categorical
          label: Is delivered
          description: >
            'true' when the parcel reached the delivered last-mile
            checkpoint (`delivered_ts` is not null), otherwise 'false'.
          expr: "case when delivered_ts is not null then 'true' else 'false' end"
    metrics:

      # ---- commerce money ---------------------------------------------
      - name: gmv
        type: simple
        label: GMV
        description: >
          Gross merchandise value summed over the parcels in scope. Swept per
          `tracking_id` from `wish.fact_trans_detail`; excludes cancelled
          order states upstream.
        agg: sum
        expr: gmv
        fill_nulls_with: 0
      - name: paid_amount
        type: simple
        label: Paid amount
        description: >
          Amount paid by the customer, summed over the parcels in scope.
        agg: sum
        expr: paid_amount
        fill_nulls_with: 0
      - name: refund_amount
        type: simple
        label: Refund amount
        description: >
          Total refund amount summed over the parcels in scope.
        agg: sum
        expr: refund_amount
        fill_nulls_with: 0
      - name: logistics_refund_amount
        type: simple
        label: Logistics refund amount
        description: >
          Logistics-specific refund amount summed over the parcels in scope.
        agg: sum
        expr: logistics_refund_amount
        fill_nulls_with: 0
      - name: discount_amount
        type: simple
        label: Discount amount
        description: >
          Total discount applied, summed over the parcels in scope.
        agg: sum
        expr: discount_amount
        fill_nulls_with: 0
      - name: order_value
        type: simple
        label: Order value
        description: >
          Net order value (`paid_price - discount_amount`) summed over the
          parcels in scope.
        agg: sum
        expr: order_value
        fill_nulls_with: 0
      - name: total_merchant_value
        type: simple
        label: Total merchant value
        description: >
          Total merchant value `SUM((merchant_shipping + merchant_price) *
          quantity)` summed over the parcels in scope.
        agg: sum
        expr: total_merchant_value
        fill_nulls_with: 0
      - name: max_merchant_value
        type: simple
        label: Max merchant value
        description: >
          Maximum merchant value per order. `max` because the sweep already
          reduced the merchant value to one row per `tracking_id`.
        agg: max
        expr: max_merchant_value
        fill_nulls_with: 0
      - name: avg_merchant_value
        type: simple
        label: Average merchant value
        description: >
          Average merchant value per order, as reduced by the Sweeper join.
        agg: average
        expr: avg_merchant_value
        fill_nulls_with: 0
      - name: wish_transaction_value
        type: simple
        label: Wish transaction value
        description: >
          Value of the order on the Wish platform, summed over the parcels in
          scope.
        agg: sum
        expr: wish_transaction_value
        fill_nulls_with: 0
      - name: quantity
        type: simple
        label: Quantity
        description: >
          Total quantity of items, summed over the parcels in scope.
        agg: sum
        expr: quantity
        fill_nulls_with: 0
      - name: product_count
        type: simple
        label: Product count
        description: >
          Number of products on the order, summed over the parcels in scope.
        agg: sum
        expr: product_count
        fill_nulls_with: 0
      - name: declared_value
        type: simple
        label: Declared value
        description: >
          Declared value for customs / insurance, summed over the parcels in
          scope.
        agg: sum
        expr: declared_value
        fill_nulls_with: 0
      - name: weight
        type: simple
        label: Weight
        description: >
          Declared weight (kg), summed over the parcels in scope.
        agg: sum
        expr: weight
        fill_nulls_with: 0
      - name: actual_weight
        type: simple
        label: Actual weight
        description: >
          Actual weight before sending (kg), summed over the parcels in scope.
        agg: sum
        expr: actual_weight
        fill_nulls_with: 0
      - name: volumetric_weight
        type: simple
        label: Volumetric weight
        description: >
          Volumetric weight computed from the parcel dimensions, summed over the
          parcels in scope.
        agg: sum
        expr: volumetric_weight
        fill_nulls_with: 0
      - name: lm_total_weight
        type: simple
        label: Combined shipment total weight
        description: >
          Total actual weight of the combined shipment the parcel was merged
          into. Because the same combined shipment is repeated on every
          parcel it absorbed, this measure double counts within a
          combined group - prefer `actual_weight` for parcel-level
          weight analysis.
        agg: sum
        expr: lm_total_weight
        fill_nulls_with: 0
      - name: avg_weight_proportion
        type: simple
        label: Average weight proportion
        description: >
          Average share of the combined shipment's weight carried by the parcel
          (`actual_weight / SUM(actual_weight) OVER (PARTITION BY
          post.tracking_id)`). 1.0 for a parcel that was not combined.
        agg: average
        expr: weight_proportion
        fill_nulls_with: 0
      - name: cnt_m_transaction_id
        type: simple
        label: Merchant transaction count
        description: >
          Count of merchant transaction ids on the parcel, summed over the
          parcels in scope.
        agg: sum
        expr: cnt_m_transaction_id
        fill_nulls_with: 0
      - name: cnt_wish_user_id
        type: simple
        label: Buyer count
        description: >
          Count of Wish buyer ids on the parcel, summed over the parcels in
          scope.
        agg: sum
        expr: cnt_wish_user_id
        fill_nulls_with: 0
      - name: cnt_merchant_id
        type: simple
        label: Merchant count
        description: >
          Count of merchant ids on the parcel, summed over the parcels in scope.
        agg: sum
        expr: cnt_merchant_id
        fill_nulls_with: 0
      - name: has_unity_order
        type: simple
        label: Unity order count
        description: >
          Number of parcels that include Unity products (`wish.fact_trans_detail.is_unity_order`), summed over the parcels in scope.
        agg: sum
        expr: has_unity_order
        fill_nulls_with: 0

      # ---- finance fees (sales + purchase) ---------------------------
      - name: purchase_logistics_fee
        type: simple
        label: Purchase logistics fee
        description: >
          Logistics fee paid by WishPost (fee type 102) for the first-mile leg,
          from `wishpost.wishpost_payment_purchase_dump_cn_mongo`.
        agg: sum
        expr: purchase_logistics_fee
        fill_nulls_with: 0
      - name: purchase_warehouse_fee
        type: simple
        label: Purchase warehouse fee
        description: >
          Warehouse handling fee paid by WishPost (material ids 108, 135).
        agg: sum
        expr: purchase_warehouse_fee
        fill_nulls_with: 0
      - name: purchase_vat_fee
        type: simple
        label: Purchase VAT fee
        description: >
          VAT fee paid by WishPost (material id 126).
        agg: sum
        expr: purchase_vat_fee
        fill_nulls_with: 0
      - name: purchase_volumetric_fee
        type: simple
        label: Purchase volumetric fee
        description: >
          Volumetric weight fee paid by WishPost (material id 307, from the
          offline payment dump).
        agg: sum
        expr: purchase_volumetric_fee
        fill_nulls_with: 0
      - name: purchase_other_fee
        type: simple
        label: Purchase other fee
        description: >
          Other purchase fees paid by WishPost.
        agg: sum
        expr: purchase_other_fee
        fill_nulls_with: 0
      - name: purchase_large_cargo_fee_post
        type: simple
        label: Purchase large cargo fee (last mile)
        description: >
          Large-cargo logistics fee allocated to the combined (post) shipment,
          from `wishpost.wishpost_payment_allocation_cn_mongo`.
        agg: sum
        expr: purchase_large_cargo_fee_post
        fill_nulls_with: 0
      - name: purchase_logistics_fee_post
        type: simple
        label: Purchase logistics fee (last mile)
        description: >
          Logistics fee allocated to the combined (post) shipment.
        agg: sum
        expr: purchase_logistics_fee_post
        fill_nulls_with: 0
      - name: purchase_warehouse_fee_post
        type: simple
        label: Purchase warehouse fee (last mile)
        description: >
          Warehouse fee allocated to the combined (post) shipment.
        agg: sum
        expr: purchase_warehouse_fee_post
        fill_nulls_with: 0
      - name: purchase_vat_fee_post
        type: simple
        label: Purchase VAT fee (last mile)
        description: >
          VAT fee allocated to the combined (post) shipment.
        agg: sum
        expr: purchase_vat_fee_post
        fill_nulls_with: 0
      - name: purchase_volumetric_fee_post
        type: simple
        label: Purchase volumetric fee (last mile)
        description: >
          Volumetric fee allocated to the combined (post) shipment.
        agg: sum
        expr: purchase_volumetric_fee_post
        fill_nulls_with: 0
      - name: purchase_other_fee_post
        type: simple
        label: Purchase other fee (last mile)
        description: >
          Other fees allocated to the combined (post) shipment.
        agg: sum
        expr: purchase_other_fee_post
        fill_nulls_with: 0
      - name: sale_logistics_fee
        type: simple
        label: Sale logistics fee
        description: >
          Logistics fee charged to the customer (fee type 102), from
          `wishpost.wishpost_payment_sales_dump_cn_mongo`.
        agg: sum
        expr: sale_logistics_fee
        fill_nulls_with: 0
      - name: sale_overtime_fine
        type: simple
        label: Sale overtime fine
        description: >
          Overtime penalty charged to the customer (fee type 108).
        agg: sum
        expr: sale_overtime_fine
        fill_nulls_with: 0
      - name: sale_other_fee
        type: simple
        label: Sale other fee
        description: >
          Other fees charged to the customer (fee type 118).
        agg: sum
        expr: sale_other_fee
        fill_nulls_with: 0

      # ---- flat rate coefficients ------------------------------------
      - name: flat_rate_coefficient_numerator
        type: simple
        label: Flat rate coefficient numerator
        description: >
          Numerator of the flat-rate shipping coefficient, summed over the
          parcels in scope.
        agg: sum
        expr: flat_rate_coefficient_numerator
        fill_nulls_with: 0
      - name: flat_rate_coefficient_denominator
        type: simple
        label: Flat rate coefficient denominator
        description: >
          Denominator of the flat-rate shipping coefficient, summed over the
          parcels in scope.
        agg: sum
        expr: flat_rate_coefficient_denominator
        fill_nulls_with: 0

      # ---- counts -----------------------------------------------------
      - name: order_rows
        type: simple
        label: Parcel rows
        description: >
          Number of rows (parcels) in scope. Use this for row-level counts such
          as the documented `COUNT(*)`; use `parcels` for the distinct
          `tracking_id` count.
        agg: count
        expr: 1
        fill_nulls_with: 0
      - name: parcels
        type: simple
        label: Parcels
        description: >
          Distinct first-mile WishPost parcels (`tracking_id`) in scope.
        agg: count_distinct
        expr: tracking_id
        fill_nulls_with: 0
      - name: orders
        type: simple
        label: Orders
        description: >
          Distinct WishPost logistics orders (`id`) in scope.
        agg: count_distinct
        expr: id
        fill_nulls_with: 0
      - name: buyers
        type: simple
        label: Buyers
        description: >
          Distinct Wish buyers (`wish_user_id`) in scope.
        agg: count_distinct
        expr: wish_user_id
        fill_nulls_with: 0
      - name: merchants
        type: simple
        label: Merchants
        description: >
          Distinct Wish merchants (`merchant_id`) in scope.
        agg: count_distinct
        expr: merchant_id
        fill_nulls_with: 0
      - name: last_mile_parcels
        type: simple
        label: Last mile shipments
        description: >
          Distinct combined (post) shipments (`tracking_id_post`) in scope. NULL
          for standalone parcels, which were never combined.
        agg: count_distinct
        expr: tracking_id_post
        fill_nulls_with: 0
      - name: delivered_parcels
        type: simple
        label: Delivered parcels
        description: >
          Number of parcels that reached the delivered last-mile checkpoint
          (`delivered_ts` is not null). Matches the documented
          `SUM(CASE WHEN delivered_ts IS NOT NULL THEN 1 ELSE 0 END)`.
        agg: count
        expr: 1
        fill_nulls_with: 0
        filter: "{{ Dimension('wp_order_full_cycle_day__is_delivered') }} = 'true'"

      # ---- derived ----------------------------------------------------
      - name: logistics_profit
        type: derived
        label: Logistics profit
        description: >
          The documented logistics profit formula: `sale_logistics_fee -
          purchase_logistics_fee`. Covers the first-mile leg only; the
          last-mile allocated purchase cost is reported separately as
          `total_purchase_fee_post`. Can be negative (losses).
        expr: sale_logistics_fee - purchase_logistics_fee
        input_metrics:
          - name: sale_logistics_fee
          - name: purchase_logistics_fee
      - name: total_sale_fee
        type: derived
        label: Total sale fee
        description: >
          Everything charged to the customer: logistics fee + overtime fine +
          other sale fees. Can be negative where fees are refunded.
        expr: sale_logistics_fee + sale_overtime_fine + sale_other_fee
        input_metrics:
          - name: sale_logistics_fee
          - name: sale_overtime_fine
          - name: sale_other_fee
      - name: total_purchase_fee
        type: derived
        label: Total purchase fee
        description: >
          First-mile cost paid by WishPost: logistics + warehouse + VAT +
          volumetric + other purchase fees. Can be negative where
          purchase amounts are credited back.
        expr: purchase_logistics_fee + purchase_warehouse_fee + purchase_vat_fee + purchase_volumetric_fee + purchase_other_fee
        input_metrics:
          - name: purchase_logistics_fee
          - name: purchase_warehouse_fee
          - name: purchase_vat_fee
          - name: purchase_volumetric_fee
          - name: purchase_other_fee
      - name: total_purchase_fee_post
        type: derived
        label: Total purchase fee (last mile)
        description: >
          Last-mile cost allocated to the combined shipment: large cargo +
          logistics + warehouse + VAT + volumetric + other allocated
          purchase fees.
        expr: purchase_large_cargo_fee_post + purchase_logistics_fee_post + purchase_warehouse_fee_post + purchase_vat_fee_post + purchase_volumetric_fee_post + purchase_other_fee_post
        input_metrics:
          - name: purchase_large_cargo_fee_post
          - name: purchase_logistics_fee_post
          - name: purchase_warehouse_fee_post
          - name: purchase_vat_fee_post
          - name: purchase_volumetric_fee_post
          - name: purchase_other_fee_post
      - name: total_profit
        type: derived
        label: Total profit
        description: >
          First-mile P&L: total sale fees minus total purchase fees. Flattened
          from the simple fee metrics so no derived metric depends on
          another derived metric. Excludes the last-mile allocated
          purchase cost (`total_purchase_fee_post`). Can be negative
          (losses).
        expr: sale_logistics_fee + sale_overtime_fine + sale_other_fee - purchase_logistics_fee - purchase_warehouse_fee - purchase_vat_fee - purchase_volumetric_fee - purchase_other_fee
        input_metrics:
          - name: sale_logistics_fee
          - name: sale_overtime_fine
          - name: sale_other_fee
          - name: purchase_logistics_fee
          - name: purchase_warehouse_fee
          - name: purchase_vat_fee
          - name: purchase_volumetric_fee
          - name: purchase_other_fee
      - name: gmv_per_parcel
        type: derived
        label: GMV per parcel
        description: >
          GMV divided by the number of distinct parcels in scope. NULL when
          there are no parcels in the selection.
        expr: gmv / nullif(parcels, 0)
        input_metrics:
          - name: gmv
          - name: parcels
      - name: flat_rate_coefficient
        type: derived
        label: Flat rate coefficient
        description: >
          Flat-rate shipping coefficient: numerator divided by denominator.
          NULL when the denominator is zero.
        expr: flat_rate_coefficient_numerator / nullif(flat_rate_coefficient_denominator, 0)
        input_metrics:
          - name: flat_rate_coefficient_numerator
          - name: flat_rate_coefficient_denominator

      # ---- ratio ------------------------------------------------------
      - name: profit_margin
        type: ratio
        label: Profit margin
        description: >
          First-mile profit divided by total sale fees (0.2 = 20% margin).
          Derived from the simple fee metrics of the same model; inherits
          the snapshot caveat of its inputs - filter to a single `dt`
          partition for a point-in-time number.
        numerator: total_profit
        denominator: total_sale_fee
      - name: delivery_rate
        type: ratio
        label: Delivery rate
        description: >
          Share of parcels in scope that reached the delivered last-mile
          checkpoint. Matches the documented
          `SUM(CASE WHEN delivered_ts IS NOT NULL THEN 1 ELSE 0 END) *
          100.0 / COUNT(*)` (as a fraction, not a percentage).
        numerator: delivered_parcels
        denominator: parcels
