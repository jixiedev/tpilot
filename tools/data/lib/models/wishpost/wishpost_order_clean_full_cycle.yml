      - name: dt
        description: >
          Hive partition date, cast from the varchar `YYYY-MM-DD` partition key.
          Written by the DAG as `dt = ds + 1` day, so it is the batch scope /
          snapshot date, NOT a parcel event date. Always filter on `dt` for
          partition pruning and restrict to a single `dt` before summing an
          additive measure.
        granularity: day
        dimension:
          type: time
          label: Snapshot date
          is_partition: true
        data_tests:
          - not_null
      - name: time
        description: >
          ETL load timestamp: Spark `unix_timestamp()` when the row was written.
          Not a business time and not the partition date - never use it as a
          business filter.
      - name: order_created_time
        description: >
          When the first-mile WishPost order was created (UTC epoch seconds).
      - name: order_created_at
        description: >
          `order_created_time` projected to a timestamp (UTC epoch seconds).
          Kept for joins and sub-day TTD arithmetic; not registered as a
          MetricFlow time dimension (the project time spine is day).
      - name: order_created_day
        description: >
