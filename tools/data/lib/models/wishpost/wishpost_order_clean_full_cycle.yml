version: 2

models:
  - name: wishpost_order_clean_full_cycle
    description: >
      WishPost logistics order fact covering the complete parcel lifecycle, from first-mile pickup through last-mile delivery, with the commerce and China payment finance rollups attached. Grain is one row per first-mile WishPost parcel (`tracking_id`) per `dt` snapshot partition.
      Built by the Airflow DAG `dag_tahoe_wosp_order_clean_full_cycle` (task `full_cycle_query`, daily 09:00 Asia/Shanghai). The task LEFT JOINs `wishpost.tmp_wishpost_order_clean_with_finance` (first-mile rows, `combined_to <> 'None'`) to the combined-program rows of the same table on `pre.combined_to = post.id`, and UNION ALLs the standalone rows (`combined_to = 'None'`). The optional last-mile shipment is therefore exposed through the `*_post` columns, and the parcel's share of the combined shipment's weight through `weight_proportion`.
      IMPORTANT - `dt` is a snapshot ("as of") date, not the order date: the upstream `wishpost.wishpost_order_clean` keeps a rolling ~200-day window of orders per partition (`order_created_time >= unix_timestamp(ds - 200 days)`), so every parcel re-appears in up to ~200 consecutive `dt` partitions. Summing an additive measure over more than one `dt` value counts each parcel once per partition it appears in. `dt` is the default metric time dimension; use `order_created_day` (or the other journey `*_day` columns) for business-date cuts, and restrict to a single `dt` for snapshot-scoped ("as of") reporting.
      All `bigint` time columns are Unix epoch seconds: the raw integer is kept for joins, and a `*_at` timestamp plus a `*_day` calendar date are added for the day-granularity time dimensions (the project time spine is day). `time` is the Spark load instant and must never be used as a business filter. Money columns are swept per `tracking_id` from `wish.fact_trans_detail` and are not FX-converted upstream; the finance step applies the documented currency conversion (USD x 6.5, ZAR x 0.45).
      This wrapper performs no joins. Tableau models under `semantic_layer/models/tableau/` own the dimension joins (channel, warehouse, pricing program) and `ref()` this model. Materialized as a view in `semantic_dw`; the physical Hive table is never modified.
    config:
      meta:
        owner: jixie
        hive_table: wishpost.wishpost_order_clean_full_cycle
        dag: dag_tahoe_wosp_order_clean_full_cycle
        task: full_cycle_query
        upstream_table: wishpost.tmp_wishpost_order_clean_with_finance
        grain: one row per (dt, tracking_id) - first-mile parcel per daily snapshot
        timezone: Asia/Shanghai
    semantic_model:
      enabled: true
      name: wishpost_order_clean_full_cycle
      config:
        meta:
          usage: >
            **Grain**: one row per `(dt, tracking_id)` - a daily snapshot of the WishPost order book, not an event log. Always filter `dt` for partition pruning and restrict to a single `dt` before summing an additive measure; use `order_created_day` for business-date cohort cuts.
            The default metric time dimension is `dt`. Every journey milestone is also exposed as a day-granularity time dimension (`order_created_day`, `pickup_day`, `arrive_hub_day`, `out_for_delivery_day`, `delivered_day`, ...), so TTD can be sliced at any point of the journey.
            `state` / `state_post` / `carrier_pickup_state` / `cancel_source` / `cancel_reason` / `pay_currency` / `warehouse` are raw codes and each has a `*_name` label alongside it. `order_channel` keeps its raw id plus a `order_channel_name` label for the documented channel ids; join `wishpost.dim_order_channel_cn_mongo` in a Tableau model for the full channel taxonomy.
            Unix-epoch timestamps stay as bigint columns for joins; the `*_day` columns are the day-granularity time dimensions and the `*_at` columns are display-only timestamps.
    agg_time_dimension: dt
    columns:
      - name: tracking_dt_id
        description: >
          Surrogate primary key: `dt | tracking_id`. Identifies one first-mile
          parcel inside one `dt` snapshot partition. `tracking_id` alone is not
          unique in this table because every `dt` partition is a full daily
          snapshot of the order book.
        entity:
          type: primary
          name: wp_order_full_cycle_day
          description: >
            One first-mile WishPost parcel inside one `dt` snapshot
            partition.
        data_tests:
          - not_null
          - unique
      - name: tracking_id
        description: >
          First-mile WishPost tracking id - the parcel key and the grain of this
          table. Unique within a `dt` partition; the same parcel reappears in
          every daily snapshot.
        entity:
          type: foreign
          name: wishpost_tracking
          description: >
            One first-mile WishPost parcel (tracking id) of the
            order book.
      - name: tracking_id_post
        description: >
          Tracking id of the combined (post) shipment the parcel was merged
          into. NULL for standalone parcels that were never combined.
        entity:
          type: foreign
          name: wp_combine_tracking
          description: >
            One combined (post) shipment that first-mile parcels
            were merged into.
      - name: id
        description: >
          Mongo order document id of the first-mile order (passthrough from
          `wishpost.wishpost_order_clean`).
        entity:
          type: foreign
          name: wp_order
          description: >
            One WishPost logistics order (Mongo order id).
      - name: id_post
        description: >
          Mongo order document id of the combined (post) order. NULL for
          standalone parcels.
        entity:
          type: foreign
          name: wp_combine_order
          description: >
            One combined (post) WishPost order.
      - name: wishpost_user_id
        description: WishPost user.
        entity:
          type: foreign
          name: wishpost_user
          description: >
            One WishPost app user (the merchant-side account that
            owns the order).
      - name: wishpost_user_id_post
        description: WishPost user.
        entity:
          type: foreign
          name: wishpost_user
          description: >
            One WishPost app user (combined shipment).
      - name: wish_standard_tracking_id
        description: Wish standard tracking.
        entity:
          type: foreign
          name: wishpost_standard_tracking
          description: >
            One Wish standard tracking id.
      - name: wish_standard_tracking_id_post
        description: Wish standard tracking.
        entity:
          type: foreign
          name: wishpost_standard_tracking
          description: >
            One Wish standard tracking id (combined shipment).
      - name: last_mile_tracking_id
        description: Last mile tracking.
        entity:
          type: foreign
          name: last_mile_tracking
          description: >
            One last-mile carrier parcel tracking number.
      - name: last_mile_carrier
        description: Last mile carrier.
        dimension:
          type: categorical
          label: Last mile carrier
      - name: wish_transaction_id
        description: Wish transaction.
        entity:
          type: foreign
          name: wish_transaction
          description: >
            One Wish commerce transaction.
      - name: wish_transaction_id_post
        description: Wish transaction.
        entity:
          type: foreign
          name: wish_transaction
          description: >
            One Wish commerce transaction (combined shipment).
      - name: wish_transaction_id_list
        description: Wish transaction id list.
