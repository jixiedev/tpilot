version: 2

models:
  - name: merchant_user
    description: >
      Current-state master record of every merchant user account on the Wish
      marketplace. One row per account: the Mongo `ObjectId` hex string in
      `id` is the primary key, and the producing dump de-duplicates on it
      (`ROW_NUMBER() OVER (PARTITION BY id ORDER BY id)`) before it writes
      `wish.merchant_user`.

      The physical object is a Hive table over the MongoDB `sweeper-merchant`
      `MerchantUser` collection, refreshed every day at 00:00 UTC by the
      Airflow DAG `MerchantUserDump`. It is NOT partitioned and carries no
      snapshot-date column, so there is no partition time dimension. The
      default `agg_time_dimension` is `onboarding_completed_calendar_date` --
      the merchant onboarding-completion day -- which is a COHORT anchor, not
      a snapshot day: grouping by it answers "merchant users that finished
      onboarding that day". Accounts that never finished onboarding have a
      NULL date and are therefore dropped from a time-bucketed query; use
      `last_active_calendar_date` when the intent is recency instead.

      This is an account dimension, not an event log: every row carries the
      account state as of the last successful daily dump. The account-level
      counters (`num_noti_attention`, `emails_sent`, `phone_calls_made`,
      `sms_codes_sent`, `sms_validation_attempts`, `tfa_attempts`) and the
      monetary snapshots (`annual_gmv`, `preorder_gmv`) are as-of-dump values
      and are NOT additive over time -- summing them across dates double
      counts the same account. `rev_share` and `erp_promo_rev_share` are
      rates (percent, 0-100) and must be averaged, not summed.

      The enum code columns are kept as categorical dimensions next to a
      human-readable `<enum>_name` column. The 'True' / 'False' string flags
      are kept as raw categorical dimensions next to a boolean `*_flag`
      column, so filters read
      `{% raw %}{{ Dimension }}{% endraw %} = true`.

      Credential columns (password, api_key, OAuth and two-factor tokens,
      one-time validation codes) are not part of this model at all: the
      physical view exposes them but the wrapper does not select them, so
      they are never materialised into the `semantic_dw` schema. PII columns
      (`email`, `username`, name, phone, address, identity documents) are
      exposed by the view and are intentionally NOT exposed as MetricFlow
      dimensions.

      Source: documentation/llm_generated/hive/wish/merchant_user.md
    config:
      meta:
        owner: jixie
        hive_table: wish.merchant_user
        upstream_collection: 'MongoDB sweeper-merchant.MerchantUser'
        dag_id: MerchantUserDump
        grain: one row per merchant user account (id)
        primary_key: id
        partition_column: none (the table is not partitioned)
    semantic_model:
      enabled: true
      name: merchant_user
      config:
        meta:
          usage: >
            Current-state merchant user account master (one row per account),
            not an event log: every row carries the account state as of the last
            successful daily dump and the table is fully replaced each run. There
            is no snapshot date, so the default agg_time_dimension
            (onboarding_completed_calendar_date) is a cohort anchor -- accounts
            that never finished onboarding have a NULL date and are therefore
            dropped from a time-bucketed query. Count accounts with
            `merchant_users` (count_distinct id) rather than `merchant_user_rows`
            (row count) when the grain matters. The account counters and the
            monetary snapshots are not additive over time; `rev_share` and
            `erp_promo_rev_share` are rates and must be averaged. MetricFlow time
            dimensions are day grain only (project time spine); the `*_ts` and
            `*_epoch` columns are plain columns for joins. The
            `merchant_user` entity is shared with the tagging models
            (`sweeper.ipv_audit_results`, `sweeper.true_brand_tagging`), which
            carry it as a foreign key.
    primary_entity: merchant_user
    agg_time_dimension: onboarding_completed_calendar_date

    columns:
      # ------------------------------------------------------------------
      # entities
      # ------------------------------------------------------------------
      - name: id
        description: 'Unique user ID (MongoDB ObjectId)'
        entity:
          type: primary
          name: merchant_user
          description: 'A merchant user account on the Wish marketplace (one MongoDB `MerchantUser` document).'
      - name: merchant_id
        description: 'Merchant ID (MongoDB ObjectId)'
        entity:
          type: foreign
          name: merchant
          description: >
            The commerce merchant this user account belongs to. Join key to the `merchant` entity of
            `wish.commerce_merchant`.
      - name: username
        description: 'PII. Username (unique, 3-25 characters)'
        entity:
          type: unique
          name: merchant_user_username
          description: 'Unique login name of the merchant user account.'
      - name: email
        description: 'User''s email address (PII)'
        entity:
          type: unique
          name: merchant_user_email
          description: 'Unique e-mail address of the merchant user account.'

      # ------------------------------------------------------------------
      # time dimensions (day grain only -- the project time spine is day)
      # ------------------------------------------------------------------
      - name: onboarding_completed_calendar_date
        description: >
          UTC calendar day on which the merchant user completed onboarding. Derived from
          `onboarding_completed_time`, which the producer writes as unix seconds in a digit
          string. Raw column: Timestamp when onboarding was completed
        granularity: day
        dimension:
          type: time
          label: 'Onboarding completed date'
      - name: last_active_calendar_date
        description: >
          UTC calendar day of the merchant user's last recorded activity. Derived from the integer
          epoch column `date_last_active` (unix seconds). Raw column: Timestamp of last activity
        granularity: day
        dimension:
          type: time
          label: 'Last active date'
      - name: claimed_by_calendar_date
        description: >
          UTC calendar day on which the merchant account was claimed by a business-development
          rep. Derived from `claimed_by_time`, which the producer writes as unix seconds in a
          digit string. Raw column: Timestamp when merchant was claimed
        granularity: day
        dimension:
          type: time
          label: 'Claimed date'
      - name: vacation_start_calendar_date
        description: >
          UTC calendar day on which the merchant's vacation mode starts. Derived from
          `vacation_start_date`, which the producer writes as unix seconds in a digit string. Raw
          column: Vacation start date
        granularity: day
        dimension:
          type: time
          label: 'Vacation start date'
      - name: vacation_end_calendar_date
        description: >
          UTC calendar day on which the merchant's vacation mode ends. Derived from
          `vacation_end_date`, which the producer writes as unix seconds in a digit string. Raw
          column: Vacation end date
        granularity: day
        dimension:
          type: time
          label: 'Vacation end date'
      - name: payment_error_calendar_date
        description: >
          UTC calendar day of the merchant's last recorded payment error. Derived from
          `payment_error_date`, which the producer writes as unix seconds in a digit string. Raw
          column: Payment error date
        granularity: day
        dimension:
          type: time
          label: 'Payment error date'
      - name: sms_blocked_expiry_calendar_date
        description: >
          UTC calendar day on which the SMS block on the account expires. Derived from
          `sms_blocked_expiry_date`, which the producer writes as unix seconds in a digit string.
          Raw column: SMS blocked expiry date
        granularity: day
        dimension:
          type: time
          label: 'SMS blocked expiry date'

      # ------------------------------------------------------------------
      # enum dimensions -- raw code plus the human-readable label
      # ------------------------------------------------------------------
      - name: merchant_state
        description: >
          Merchant state code (1=PENDING, 2=APPROVED, 3=DISABLED, 4=REQUEST_INFO, 5=PENDING_PHONE,
          6=VACATION, 7=PENDING_EMAIL, 8=WISH_EXPRESS_ONLY).
        dimension:
          type: categorical
          label: 'Merchant state'
      - name: merchant_state_name
        description: >
          Human-readable label for `merchant_state`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Merchant state (name)'
      - name: auto_payment_status
        description: 'Auto payment processing code (1=MANUAL, 2=NET_N).'
        dimension:
          type: categorical
          label: 'Auto payment status'
      - name: auto_payment_status_name
        description: >
          Human-readable label for `auto_payment_status`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Auto payment status (name)'
      - name: store_id_source
        description: >
          Store id source code (1=MANUAL, 2=ERP, 3=PSP, 4=PAYPAL). The documentation only lists
          1=Manual.
        dimension:
          type: categorical
          label: 'Store id source'
      - name: store_id_source_name
        description: >
          Human-readable label for `store_id_source`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Store id source (name)'
      - name: payment_provider
        description: >
          Payment provider code (0=PAYPAL, 1=BILL, 2=CARDINFOLINK, 3=PAYONEER, 4=PINGPONG,
          5=UMPAY, 6=PAYPAL_MERCH, 7=UMPAY_ENTERPRISE, 8=ALLPAY, 9=WISHPAY, 10=PAYECO2, 11=UMPAY2,
          12=LIANLIAN, 13=PAYPAL_EEA).
        dimension:
          type: categorical
          label: 'Payment provider'
      - name: payment_provider_name
        description: >
          Human-readable label for `payment_provider`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Payment provider (name)'
      - name: entity_type
        description: >
          Entity type code ('1'=INDIVIDUAL, '2'=COMPANY). The column is a string and may carry the
          '1.0' / '2.0' float spelling.
        dimension:
          type: categorical
          label: 'Entity type'
      - name: entity_type_name
        description: >
          Human-readable label for `entity_type`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Entity type (name)'
      - name: force_reset
        description: 'Forced account reset code (0=NONE, 1=PASSWORD, 2=NEW_ACCOUNT, 3=SECURITY).'
        dimension:
          type: categorical
          label: 'Force reset'
      - name: force_reset_name
        description: >
          Human-readable label for `force_reset`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Force reset (name)'
      - name: take_weekly_test
        description: 'Weekly test state code (0=OFF).'
        dimension:
          type: categorical
          label: 'Take weekly test'
      - name: take_weekly_test_name
        description: >
          Human-readable label for `take_weekly_test`. The raw code column stays a categorical
          dimension of its own.
        dimension:
          type: categorical
          label: 'Take weekly test (name)'
      - name: tfa_type
        description: 'Two-factor authentication type code (1=DEFAULT).'
        dimension:
          type: categorical
          label: 'Two-factor authentication type'
      - name: tfa_type_name
        description: >
          Human-readable label for `tfa_type`. The raw code column stays a categorical dimension
          of its own.
        dimension:
          type: categorical
          label: 'Two-factor authentication type (name)'

      # ------------------------------------------------------------------
      # flags -- raw 'True'/'False' string column plus the boolean version
      # ------------------------------------------------------------------
      - name: is_active
        description: >
          Account activity flag ('True' / 'False' string). Raw flag column; use `is_active_flag`
          for filtering.
        dimension:
          type: categorical
          label: 'Is active'
      - name: is_active_flag
        description: >
          Boolean version of `is_active`. Source values that are not 'true' (case insensitive) map
          to false.
        dimension:
          type: categorical
          label: 'Is active (flag)'
      - name: is_banned
        description: >
          Banned-account flag ('True' / 'False' string). Raw flag column; use `is_banned_flag` for
          filtering.
        dimension:
          type: categorical
          label: 'Is banned'
      - name: is_banned_flag
        description: >
          Boolean version of `is_banned`. Source values that are not 'true' (case insensitive) map
          to false.
        dimension:
          type: categorical
          label: 'Is banned (flag)'
      - name: is_cn_merchant
        description: >
          China-merchant flag, derived by the producer from the phone number country, the
          business-address country and the BD-rep country ('True' / 'False' string). Raw flag
          column; use `is_cn_merchant_flag` for filtering.
        dimension:
          type: categorical
          label: 'Is China merchant'
      - name: is_cn_merchant_flag
        description: >
          Boolean version of `is_cn_merchant`. Source values that are not 'true' (case
          insensitive) map to false.
        dimension:
          type: categorical
          label: 'Is China merchant (flag)'
      - name: enabled
        description: >
          Account enabled flag ('True' / 'False' string). Raw flag column; use `enabled_flag` for
          filtering.
        dimension:
          type: categorical
          label: 'Enabled'
      - name: enabled_flag
        description: >
          Boolean version of `enabled`. Source values that are not 'true' (case insensitive) map
          to false.
        dimension:
          type: categorical
          label: 'Enabled (flag)'
      - name: authorized
        description: >
          Authorization flag ('True' / 'False' string). Raw flag column; use `authorized_flag` for
          filtering.
        dimension:
          type: categorical
          label: 'Authorized'
      - name: authorized_flag
        description: >
          Boolean version of `authorized`. Source values that are not 'true' (case insensitive)
          map to false.
        dimension:
          type: categorical
          label: 'Authorized (flag)'
      - name: onboarding_completed
        description: >
          Onboarding completed flag ('True' / 'False' string). Raw flag column; use
          `onboarding_completed_flag` for filtering.
        dimension:
          type: categorical
          label: 'Onboarding completed'
      - name: onboarding_completed_flag
        description: >
          Boolean version of `onboarding_completed`. Source values that are not 'true' (case
          insensitive) map to false.
        dimension:
          type: categorical
          label: 'Onboarding completed (flag)'
      - name: dummy_account
        description: >
          Dummy / test-account flag ('True' / 'False' string). Raw flag column; use
          `dummy_account_flag` for filtering.
        dimension:
          type: categorical
          label: 'Dummy account'
      - name: dummy_account_flag
        description: >
          Boolean version of `dummy_account`. Source values that are not 'true' (case insensitive)
          map to false.
        dimension:
          type: categorical
          label: 'Dummy account (flag)'
      - name: refunded_for_fraud
        description: >
          Refunded-for-fraud flag ('True' / 'False' string). Raw flag column; use
          `refunded_for_fraud_flag` for filtering.
        dimension:
          type: categorical
          label: 'Refunded for fraud'
      - name: refunded_for_fraud_flag
        description: >
          Boolean version of `refunded_for_fraud`. Source values that are not 'true' (case
          insensitive) map to false.
        dimension:
          type: categorical
          label: 'Refunded for fraud (flag)'
      - name: dispute_activated
        description: >
          Dispute-resolution activated flag ('True' / 'False' string). Raw flag column; use
          `dispute_activated_flag` for filtering.
        dimension:
          type: categorical
          label: 'Dispute activated'
      - name: dispute_activated_flag
        description: >
          Boolean version of `dispute_activated`. Source values that are not 'true' (case
          insensitive) map to false.
        dimension:
          type: categorical
          label: 'Dispute activated (flag)'
      - name: _fbw_activated
        description: >
          Fulfillment-by-Wish activated flag ('True' / 'False' string). Raw flag column; use
          `fbw_activated_flag` for filtering.
        dimension:
          type: categorical
          label: 'FBW activated'
      - name: fbw_activated_flag
        description: >
          Boolean version of `_fbw_activated`. Source values that are not 'true' (case
          insensitive) map to false.
        dimension:
          type: categorical
          label: 'FBW Activated (flag)'

      # ------------------------------------------------------------------
      # geography
      # ------------------------------------------------------------------
      - name: country
        description: >
          Country of the business development representative, derived by the producer from the BD
          rep id. Country information (derived from BD rep)
        dimension:
          type: categorical
          label: 'BD rep country'
      - name: merchant_country
        description: 'Merchant''s country (derived from phone/business address)'
        dimension:
          type: categorical
          label: 'Merchant country'
      - name: ba_country
        description: 'Business address country'
        dimension:
          type: categorical
          label: 'Business address country'
      - name: ba_country_code
        description: 'Business address country code'
        dimension:
          type: categorical
          label: 'Business address country code'
      - name: ba_city
        description: 'Business address city'
        dimension:
          type: categorical
          label: 'Business address city'
      - name: ba_state
        description: 'Business address state'
        dimension:
          type: categorical
          label: 'Business address state'
      - name: merchant_country_when_onboarding_completed
        description: 'Merchant country when onboarding was completed'
        dimension:
          type: categorical
          label: 'Merchant Country When Onboarding Completed'
      - name: ip_country_when_created
        description: 'IP country when account was created'
        dimension:
          type: categorical
          label: 'Ip Country When Created'
      - name: _detected_domicile_country
        description: 'Country detected based on user''s domicile information'
        dimension:
          type: categorical
          label: 'Detected Domicile Country'
      - name: bd_merchant_country
        description: 'Business development merchant country'
        dimension:
          type: categorical
          label: 'BD Merchant Country'

      # ------------------------------------------------------------------
      # account attributes
      # ------------------------------------------------------------------
      - name: locale
        description: 'User''s locale (default: en)'
        dimension:
          type: categorical
          label: 'Locale'
      - name: roles
        description: 'User roles list'
        dimension:
          type: categorical
          label: 'Roles'
      - name: permissions
        description: 'User permissions list'
        dimension:
          type: categorical
          label: 'Permissions'
      - name: new_merchant_source
        description: 'New merchant source'
        dimension:
          type: categorical
          label: 'New Merchant Source'
      - name: brand_partner_state
        description: 'Brand partner state'
        dimension:
          type: categorical
          label: 'Brand Partner State'
      - name: erp_partner_state
        description: 'ERP partner state'
        dimension:
          type: categorical
          label: 'ERP Partner State'
      - name: review_priority
        description: 'Review priority'
        dimension:
          type: categorical
          label: 'Review Priority'
      - name: net_payment_period
        description: 'Net payment period'
        dimension:
          type: categorical
          label: 'Net Payment Period'
      - name: status_to_set
        description: 'Status to be set'
        dimension:
          type: categorical
          label: 'Status To Set'
      - name: missing_info_state
        description: 'Missing information state'
        dimension:
          type: categorical
          label: 'Missing Info State'
      - name: skip_registration_fee_reason
        description: 'Reason for skipping registration fee'
        dimension:
          type: categorical
          label: 'Skip Registration Fee Reason'
      - name: special_rev_share_reason
        description: 'Special revenue share reason'
        dimension:
          type: categorical
          label: 'Special Rev Share Reason'
      - name: back_to_onboarding_reason
        description: 'Reason for returning to onboarding process'
        dimension:
          type: categorical
          label: 'Back To Onboarding Reason'
      - name: payment_error
        description: 'Payment error information'
        dimension:
          type: categorical
          label: 'Payment Error'
      - name: new_onboarding_steps_completed
        description: 'New onboarding steps completed'
        dimension:
          type: categorical
          label: 'New Onboarding Steps Completed'
      - name: utm_source
        description: 'UTM source for tracking'
        dimension:
          type: categorical
          label: 'Utm Source'
      - name: referred_by_code
        description: 'Referral code'
        dimension:
          type: categorical
          label: 'Referred By Code'
      - name: bd_invitation_code
        description: 'Business development invitation code'
        dimension:
          type: categorical
          label: 'BD Invitation Code'
      - name: loan_provider
        description: 'Loan provider information'
        dimension:
          type: categorical
          label: 'Loan Provider'

      # ------------------------------------------------------------------
      # measure columns -- referenced by metrics only, never a dimension
      # ------------------------------------------------------------------
      - name: annual_gmv_value
        description: 'Annual GMV of the merchant, cast to a double.'
      - name: assumed_hours_worked_weekday
        description: 'Assumed working hours per weekday (default: 8)'
      - name: assumed_hours_worked_weekend
        description: 'Assumed working hours per weekend day (default: 0)'
      - name: blue_ambassador_time_limit
        description: 'Blue ambassador time limit in days (default: 180)'
      - name: cur_test_num
        description: 'Current test number (default: 0)'
      - name: emails_sent
        description: 'Number of emails sent to the user'
      - name: erp_promo_rev_share_value
        description: 'ERP promotional revenue share, cast to a double.'
      - name: num_noti_attention
        description: 'Number of notifications requiring attention'
      - name: payment_error_amount_value
        description: 'Amount of the last payment error, cast to a double.'
      - name: phone_calls_made
        description: 'Number of phone calls made'
      - name: preorder_gmv_value
        description: 'Preorder GMV of the merchant, cast to a double.'
      - name: rev_share_value
        description: 'Revenue share of the merchant in percent (0-100), cast to a double.'
      - name: sms_codes_sent
        description: 'Number of SMS codes sent'
      - name: sms_validation_attempts
        description: 'Number of SMS validation attempts'
      - name: tfa_attempts
        description: 'Two-factor authentication attempts'
      - name: total_skus_value
        description: 'Number of SKUs associated with the merchant, cast to a bigint.'

      # ------------------------------------------------------------------
      # raw timestamp source columns -- the day-grain time dimensions
      # above are derived from these
      # ------------------------------------------------------------------
      - name: date_last_active
        description: >
          Timestamp of last activity The producer writes this one as an integer epoch rather than
          a digit string. Use `last_active_calendar_date` for the day-grain time dimension.
      - name: onboarding_completed_time
        description: >
          Timestamp when onboarding was completed The producer writes this one as unix seconds in
          a digit string. Use `onboarding_completed_calendar_date` for the day-grain time
          dimension.
      - name: claimed_by_time
        description: >
          Timestamp when merchant was claimed The producer writes this one as unix seconds in a
          digit string. Use `claimed_by_calendar_date` for the day-grain time dimension.
      - name: vacation_start_date
        description: >
          Vacation start date The producer writes this one as unix seconds in a digit string. Use
          `vacation_start_calendar_date` for the day-grain time dimension.
      - name: vacation_end_date
        description: >
          Vacation end date The producer writes this one as unix seconds in a digit string. Use
          `vacation_end_calendar_date` for the day-grain time dimension.
      - name: payment_error_date
        description: >
          Payment error date The producer writes this one as unix seconds in a digit string. Use
          `payment_error_calendar_date` for the day-grain time dimension.
      - name: sms_blocked_expiry_date
        description: >
          SMS blocked expiry date The producer writes this one as unix seconds in a digit string.
          Use `sms_blocked_expiry_calendar_date` for the day-grain time dimension.

      # ------------------------------------------------------------------
      # unix-second join columns -- not MetricFlow time dimensions
      # (the project time spine is day)
      # ------------------------------------------------------------------
      - name: last_active_epoch
        description: >
          Unix seconds of the last active date, as a bigint. Plain join column -- use
          `last_active_calendar_date` for the day-grain time dimension.
      - name: last_active_ts
        description: >
          Unix seconds of the last active date, as a timestamp. Plain join column -- use
          `last_active_calendar_date` for the day-grain time dimension.
      - name: onboarding_completed_epoch
        description: >
          Unix seconds of the onboarding completed date, as a bigint. Plain join column -- use
          `onboarding_completed_calendar_date` for the day-grain time dimension.
      - name: onboarding_completed_ts
        description: >
          Unix seconds of the onboarding completed date, as a timestamp. Plain join column -- use
          `onboarding_completed_calendar_date` for the day-grain time dimension.
      - name: claimed_by_epoch
        description: >
          Unix seconds of the claimed date, as a bigint. Plain join column -- use
          `claimed_by_calendar_date` for the day-grain time dimension.
      - name: claimed_by_ts
        description: >
          Unix seconds of the claimed date, as a timestamp. Plain join column -- use
          `claimed_by_calendar_date` for the day-grain time dimension.
      - name: vacation_start_epoch
        description: >
          Unix seconds of the vacation start date, as a bigint. Plain join column -- use
          `vacation_start_calendar_date` for the day-grain time dimension.
      - name: vacation_start_ts
        description: >
          Unix seconds of the vacation start date, as a timestamp. Plain join column -- use
          `vacation_start_calendar_date` for the day-grain time dimension.
      - name: vacation_end_epoch
        description: >
          Unix seconds of the vacation end date, as a bigint. Plain join column -- use
          `vacation_end_calendar_date` for the day-grain time dimension.
      - name: vacation_end_ts
        description: >
          Unix seconds of the vacation end date, as a timestamp. Plain join column -- use
          `vacation_end_calendar_date` for the day-grain time dimension.
      - name: payment_error_epoch
        description: >
          Unix seconds of the payment error date, as a bigint. Plain join column -- use
          `payment_error_calendar_date` for the day-grain time dimension.
      - name: payment_error_ts
        description: >
          Unix seconds of the payment error date, as a timestamp. Plain join column -- use
          `payment_error_calendar_date` for the day-grain time dimension.
      - name: sms_blocked_expiry_epoch
        description: >
          Unix seconds of the sms blocked expiry date, as a bigint. Plain join column -- use
          `sms_blocked_expiry_calendar_date` for the day-grain time dimension.
      - name: sms_blocked_expiry_ts
        description: >
          Unix seconds of the sms blocked expiry date, as a timestamp. Plain join column -- use
          `sms_blocked_expiry_calendar_date` for the day-grain time dimension.

