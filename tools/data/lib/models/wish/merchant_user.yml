    metrics:
      # --------------------------------------------------------------
      # account counts
      # --------------------------------------------------------------
      - name: merchant_users
        type: simple
        label: 'Merchant users'
        description: >
          Distinct merchant user accounts in the selected scope. The grain is one row per MongoDB
          `MerchantUser` document, so this equals the row count of a well-formed table.
        agg: count_distinct
        expr: id
      - name: merchant_user_rows
        type: simple
        label: 'Merchant user rows'
        description: >
          Row count at merchant-user grain. The producing dump de-duplicates on `id`, so this
          normally equals `merchant_users`.
        agg: count
        expr: 1
      - name: pending_merchant_users
        type: simple
        label: 'Pending merchant users'
        description: >
          Distinct merchant users whose merchant state is 1 (PENDING), i.e. the merchant
          application is still awaiting approval.
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__merchant_state'') }} = 1'
      - name: approved_merchant_users
        type: simple
        label: 'Approved merchant users'
        description: >
          Distinct merchant users whose merchant state is 2 (APPROVED), i.e. the merchant account
          is approved and active.
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__merchant_state'') }} = 2'
      - name: disabled_merchant_users
        type: simple
        label: 'Disabled merchant users'
        description: 'Distinct merchant users whose merchant state is 3 (DISABLED).'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__merchant_state'') }} = 3'
      - name: vacation_merchant_users
        type: simple
        label: 'Vacation merchant users'
        description: >
          Distinct merchant users whose merchant state is 6 (VACATION), i.e. the merchant is on
          holiday.
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__merchant_state'') }} = 6'
      - name: wish_express_only_merchant_users
        type: simple
        label: 'Wish Express only merchant users'
        description: 'Distinct merchant users whose merchant state is 8 (WISH_EXPRESS_ONLY).'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__merchant_state'') }} = 8'
      - name: onboarded_merchant_users
        type: simple
        label: 'Onboarded merchant users'
        description: 'Distinct merchant users who finished onboarding.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__onboarding_completed_flag'') }} = true'
      - name: active_merchant_users
        type: simple
        label: 'Active merchant users'
        description: 'Distinct merchant users flagged as active.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__is_active_flag'') }} = true'
      - name: banned_merchant_users
        type: simple
        label: 'Banned merchant users'
        description: 'Distinct merchant users flagged as banned.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__is_banned_flag'') }} = true'
      - name: enabled_merchant_users
        type: simple
        label: 'Enabled merchant users'
        description: 'Distinct merchant users whose account is enabled.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__enabled_flag'') }} = true'
      - name: authorized_merchant_users
        type: simple
        label: 'Authorized merchant users'
        description: 'Distinct merchant users who are authorized.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__authorized_flag'') }} = true'
      - name: cn_merchant_users
        type: simple
        label: 'China merchant users'
        description: >
          Distinct merchant users the producer classified as China merchants (phone country,
          business-address country or China BD rep).
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__is_cn_merchant_flag'') }} = true'
      - name: individual_merchant_users
        type: simple
        label: 'Individual merchant users'
        description: 'Distinct merchant users registered as an individual entity (`entity_type` = 1).'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__entity_type_name'') }} = ''INDIVIDUAL'''
      - name: company_merchant_users
        type: simple
        label: 'Company merchant users'
        description: 'Distinct merchant users registered as a company entity (`entity_type` = 2).'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__entity_type_name'') }} = ''COMPANY'''
      - name: dummy_merchant_users
        type: simple
        label: 'Dummy merchant users'
        description: >
          Distinct merchant users flagged as dummy / test accounts. Exclude them from production
          reporting.
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__dummy_account_flag'') }} = true'
      - name: fbw_activated_merchant_users
        type: simple
        label: 'FBW activated merchant users'
        description: 'Distinct merchant users with Fulfillment by Wish activated.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__fbw_activated_flag'') }} = true'
      - name: refunded_for_fraud_merchant_users
        type: simple
        label: 'Refunded for fraud merchant users'
        description: 'Distinct merchant users flagged as refunded for fraud.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__refunded_for_fraud_flag'') }} = true'
      - name: dispute_activated_merchant_users
        type: simple
        label: 'Dispute activated merchant users'
        description: 'Distinct merchant users with dispute resolution activated.'
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__dispute_activated_flag'') }} = true'
      - name: net_n_payment_merchant_users
        type: simple
        label: 'Net N payment merchant users'
        description: >
          Distinct merchant users on Net N (automatic) payment processing (`auto_payment_status` =
          2).
        agg: count_distinct
        expr: id
        filter: '{{ Dimension(''merchant_user__auto_payment_status'') }} = 2'
      - name: annual_gmv
        type: simple
        label: 'Annual GMV'
        description: >
          Sum of the annual GMV recorded on the merchant user account. A merchant-grain snapshot
          value -- not additive over time.
        agg: sum
        expr: annual_gmv_value
      - name: preorder_gmv
        type: simple
        label: 'Preorder GMV'
        description: >
          Sum of the preorder GMV recorded on the merchant user account. A merchant-grain snapshot
          value -- not additive over time.
        agg: sum
        expr: preorder_gmv_value
      - name: rev_share
        type: simple
        label: 'Rev share'
        description: >
          Average revenue share of the merchant users in scope. The source stores it as a
          percentage (0-100) -- a rate, so average it, do not sum it.
        agg: average
        expr: rev_share_value
      - name: erp_promo_rev_share
        type: simple
        label: 'ERP promo rev share'
        description: >
          Average ERP promotional revenue share of the merchant users in scope. A rate -- average
          it, do not sum it.
        agg: average
        expr: erp_promo_rev_share_value
      - name: payment_error_amount
        type: simple
        label: 'Payment error amount'
        description: 'Sum of the amount of the last recorded payment error.'
        agg: sum
        expr: payment_error_amount_value
      - name: total_skus
        type: simple
        label: 'Total SKUs'
        description: 'Sum of the number of SKUs associated with the merchant users in scope.'
        agg: sum
        expr: total_skus_value
      - name: num_noti_attention
        type: simple
        label: 'Notifications requiring attention'
        description: 'Sum of the notifications-attention counters of the merchant users in scope.'
        agg: sum
        expr: num_noti_attention
      - name: emails_sent
        type: simple
        label: 'Emails sent'
        description: 'Sum of the e-mails-sent counters of the merchant users in scope.'
        agg: sum
        expr: emails_sent
      - name: phone_calls_made
        type: simple
        label: 'Phone calls made'
        description: 'Sum of the phone-calls-made counters of the merchant users in scope.'
        agg: sum
        expr: phone_calls_made
      - name: sms_codes_sent
        type: simple
        label: 'SMS codes sent'
        description: 'Sum of the SMS-codes-sent counters of the merchant users in scope.'
        agg: sum
        expr: sms_codes_sent
      - name: sms_validation_attempts
        type: simple
        label: 'SMS validation attempts'
        description: 'Sum of the SMS-validation-attempt counters of the merchant users in scope.'
        agg: sum
        expr: sms_validation_attempts
      - name: tfa_attempts
        type: simple
        label: 'Two-factor authentication attempts'
        description: 'Sum of the two-factor-authentication-attempt counters of the merchant users in scope.'
        agg: sum
        expr: tfa_attempts

      # --------------------------------------------------------------
      # ratios (same model)
      # --------------------------------------------------------------
      - name: onboarding_completion_rate
        type: ratio
        label: 'Onboarding completion rate'
        description: 'Share of merchant users in scope that finished onboarding.'
        numerator: onboarded_merchant_users
        denominator: merchant_users
      - name: approved_merchant_user_rate
        type: ratio
        label: 'Approved merchant user rate'
        description: 'Share of merchant users in scope whose merchant state is APPROVED.'
        numerator: approved_merchant_users
        denominator: merchant_users
      - name: active_merchant_user_rate
        type: ratio
        label: 'Active merchant user rate'
        description: 'Share of merchant users in scope that are flagged as active.'
        numerator: active_merchant_users
        denominator: merchant_users

      # --------------------------------------------------------------
      # cumulative
      # --------------------------------------------------------------
      - name: cumulative_onboarded_merchant_users
        type: cumulative
        label: 'Cumulative onboarded merchant users'
        description: >
          Rolling 30-day count of merchant users who finished onboarding, accumulated over the
          `onboarding_completed_calendar_date` time dimension.
        input_metric: onboarded_merchant_users
        window: '30 days'
