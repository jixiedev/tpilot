[project]
name = "tahoepilot"
version = "0.1.0"
description = "AI agent CLI for data teams — multi-turn chat with Hive, Trino, and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmsclient>=0.1.1",
    "langchain>=1.3.11",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai>=2.44.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.0.0",
    "trino>=0.338.0",
    "langgraph-cli[inmem]>=0.4.31",
    "pyyaml>=6.0.3",
]

[project.scripts]
tahoepilot = "main:main"

[project.optional-dependencies]
web = [
    "copilotkit>=0.1.96",
    "ag-ui-langgraph>=0.0.43",
    "fastapi>=0.141.1",
    "uvicorn>=0.49.0",
]
k8s = [
    "kubernetes~=10.0.0",
]
rag = [
    "boto3>=1.35.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0,<2.12",
    "tika>=3.3.2",
    "markdown-it-py>=4.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
