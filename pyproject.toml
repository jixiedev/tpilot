[project]
name = "tahoepilot"
version = "0.1.0"
description = "AI agent CLI for data teams — multi-turn chat with Hive, Trino, and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hmsclient>=0.1.1",
    "langchain>=1.3.11",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "openai>=2.44.0",
    "python-dotenv>=1.0.0",
    "trino>=0.338.0",
]

[project.scripts]
tahoepilot = "agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
