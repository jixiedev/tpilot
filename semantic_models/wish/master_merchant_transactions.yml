          label: Original Rev Share Tax Entity
      - name: updated_rev_share_tag
        description: >
          Updated revenue share tag
        dimension:
          type: categorical
          label: Updated Rev Share Tag
      - name: rev_disqualified_merchant_warehouse_shipping_type
        description: >
          Revenue disqualified merchant warehouse shipping type
        dimension:
          type: categorical
          label: Rev Disqualified Merchant Warehouse Shipping Type
      - name: sensitivity_selection_reason
        description: >
          Sensitivity selection reason
        dimension:
          type: categorical
          label: Sensitivity Selection Reason
      - name: calculated_shipping_mode
        description: >
          Calculated shipping mode
        dimension:
          type: categorical
          label: Calculated Shipping Mode
      - name: picker_source
        description: >
          Picker source
        dimension:
          type: categorical
          label: Picker Source
      - name: user_confirmed_delivery
        description: >
          User confirmed delivery
        dimension:
          type: categorical
          label: User Confirmed Delivery

    metrics:
      - name: orders
        description: >
          Number of merchant transaction rows (the table doc's `total_orders`
          = COUNT(*)). One row per `m_transaction_id`.
        type: simple
        agg: count
        expr: 1
        fill_nulls_with: 0
      - name: merchants
        description: >
          Distinct merchants with at least one transaction.
        type: simple
        agg: count_distinct
        expr: merchant_id
        fill_nulls_with: 0
      - name: buyers
        description: >
          Distinct buyers (customer users) with at least one transaction.
        type: simple
        agg: count_distinct
        expr: user_id
        fill_nulls_with: 0
      - name: commerce_transactions
        description: >
          Distinct commerce (buyer-facing) transactions. One commerce
          transaction can expand into many merchant transactions.
        type: simple
        agg: count_distinct
        expr: c_transaction_id
        fill_nulls_with: 0
      - name: products
        description: >
          Distinct products ordered.
        type: simple
        agg: count_distinct
        expr: product_id
        fill_nulls_with: 0
      - name: variations
        description: >
          Distinct product variations ordered.
        type: simple
        agg: count_distinct
        expr: variation_id
        fill_nulls_with: 0
      - name: merchant_warehouses
        description: >
          Distinct merchant warehouses the orders were fulfilled from.
        type: simple
        agg: count_distinct
        expr: merchant_warehouse_id
        fill_nulls_with: 0
      - name: shipping_countries
        description: >
          Distinct shipping destination countries.
        type: simple
        agg: count_distinct
        expr: shipping_country
        fill_nulls_with: 0
      - name: refunded_transactions
        description: >
          Number of refunded merchant transactions (`state` = 5).
        type: simple
        agg: count_distinct
        expr: m_transaction_id
        filter: >
          {{ Dimension('merchant_transaction__state') }} = 5
        fill_nulls_with: 0
      - name: gmv
        description: >
          Gross merchandise value: sum of `paid_amount`, the buyer-paid amount
          (base product price + shipping + tax - discounts + refund
          adjustments). The table doc's `total_gmv`.
        type: simple
        agg: sum
        expr: paid_amount
        fill_nulls_with: 0
      - name: refund_amount
        description: >
          Total refund amount across all transactions, regardless of
          transaction state.
        type: simple
        agg: sum
        expr: refund_amount
        fill_nulls_with: 0
      - name: refunded_amount
        description: >
          Refund amount on refunded transactions only (`state` = 5). The table
          doc's `total_refunds`.
        type: simple
        agg: sum
        expr: refund_amount
        filter: >
          {{ Dimension('merchant_transaction__state') }} = 5
        fill_nulls_with: 0
      - name: avg_refund_amount
        description: >
          Average refund amount per transaction that carries a refund amount.
        type: simple
        agg: average
        expr: refund_amount
      - name: quantity
        description: >
          Total ordered quantity.
        type: simple
        agg: sum
        expr: quantity
        fill_nulls_with: 0
      - name: refunded_quantity
        description: >
          Total refunded quantity.
        type: simple
        agg: sum
        expr: qty_refunded
        fill_nulls_with: 0
      - name: merchant_price
        description: >
          Total merchant price amount (merchant proceeds from the product).
        type: simple
        agg: sum
        expr: merchant_price
        fill_nulls_with: 0
      - name: merchant_shipping
        description: >
          Total merchant shipping amount.
        type: simple
        agg: sum
        expr: merchant_shipping
        fill_nulls_with: 0
      - name: merchant_cost
        description: >
          Total cost amount borne by the merchant.
        type: simple
        agg: sum
        expr: cost
        fill_nulls_with: 0
      - name: product_price
        description: >
          Total product price amount.
        type: simple
        agg: sum
        expr: price
        fill_nulls_with: 0
      - name: original_price
        description: >
          Total original price amount before discounts.
        type: simple
        agg: sum
        expr: original_price
        fill_nulls_with: 0
      - name: shipping_amount
        description: >
          Total shipping amount.
        type: simple
        agg: sum
        expr: shipping
        fill_nulls_with: 0
      - name: merchant_shipping_cost
        description: >
          Total shipping cost amount.
        type: simple
        agg: sum
        expr: shipping_cost
        fill_nulls_with: 0
      - name: merchant_eat_cost_amount
        description: >
          Total merchant eat cost amount.
        type: simple
        agg: sum
        expr: merchant_eat_cost_amount
        fill_nulls_with: 0
      - name: avg_eat_cost_ratio
        description: >
          Average merchant eat cost ratio (`merchant_responsible_amount /
          merchant_amount`). The table doc's `avg_eat_cost_ratio`.
        type: simple
        agg: average
        expr: merchant_eat_cost_ratio
      - name: merchant_payment_amount
        description: >
          Total merchant payment amount.
        type: simple
        agg: sum
        expr: merchant_payment_amt
        fill_nulls_with: 0
      - name: merchant_payment_tax_amount
        description: >
          Total tax amount paid out with the merchant payment.
        type: simple
        agg: sum
        expr: merchant_payment_tax_amount
        fill_nulls_with: 0
      - name: merchant_tax_amount
        description: >
          Total merchant tax amount.
        type: simple
        agg: sum
        expr: merchant_tax_amount
        fill_nulls_with: 0
      - name: tax_cost
        description: >
          Total tax cost amount.
        type: simple
        agg: sum
        expr: tax_cost
        fill_nulls_with: 0
      - name: client_amount
        description: >
          Total client amount (the amount charged on the client side).
        type: simple
        agg: sum
        expr: client
        fill_nulls_with: 0
      - name: third_party_pinged
        description: >
          Number of third-party pings raised on the transaction.
        type: simple
        agg: sum
        expr: third_party_pinged
        fill_nulls_with: 0
      - name: partial_refunds
        description: >
          Total number of partial refunds.
        type: simple
        agg: sum
        expr: partial_refunds
        fill_nulls_with: 0
      - name: avg_refund_risk_score
        description: >
          Average refund risk score.
        type: simple
        agg: average
        expr: refund_risk_score
      - name: avg_business_days_to_arrival
        description: >
          Average business days to arrival.
        type: simple
        agg: average
        expr: business_days_to_arrival
      - name: avg_additional_fulfillment_hours
        description: >
          Average additional fulfillment hours.
        type: simple
        agg: average
        expr: additional_fulfillment_hours
      - name: original_rev_share
        description: >
          Total original revenue share amount.
        type: simple
        agg: sum
        expr: original_rev_share
        fill_nulls_with: 0
      - name: updated_rev_share
        description: >
          Total updated revenue share amount.
        type: simple
        agg: sum
        expr: updated_rev_share
        fill_nulls_with: 0
      - name: localized_merchant_price
        description: >
          Total merchant price amount localized into the settlement currency.
        type: simple
        agg: sum
        expr: localized_merchant_price
        fill_nulls_with: 0
      - name: localized_merchant_shipping
        description: >
          Total merchant shipping amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_merchant_shipping
        fill_nulls_with: 0
      - name: localized_merchant_shipping_cost
        description: >
          Total shipping cost amount localized into the settlement currency.
        type: simple
        agg: sum
        expr: localized_merchant_shipping_cost
        fill_nulls_with: 0
      - name: localized_merchant_cost
        description: >
          Total cost amount localized into the settlement currency.
        type: simple
        agg: sum
        expr: localized_merchant_cost
        fill_nulls_with: 0
      - name: localized_wishpost_shipping
        description: >
          Total WishPost shipping amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_wishpost_shipping
        fill_nulls_with: 0
      - name: localized_wishpost_shipping_cost
        description: >
          Total WishPost shipping cost amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_wishpost_shipping_cost
        fill_nulls_with: 0
      - name: localized_wishpost_shipping_price
        description: >
          Total WishPost shipping price amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_wishpost_shipping_price
        fill_nulls_with: 0
      - name: localized_unity_wishpost_shipping
        description: >
          Total Unity WishPost shipping amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_unity_wishpost_shipping
        fill_nulls_with: 0
      - name: localized_initial_wishpost_shipping_amount
        description: >
          Total initial WishPost shipping amount localized into the settlement
          currency.
        type: simple
        agg: sum
        expr: localized_initial_wishpost_shipping_amount
        fill_nulls_with: 0
      - name: localized_estimated_wishpost_shipping_cost
        description: >
          Total estimated WishPost shipping cost amount localized into the
          settlement currency.
        type: simple
        agg: sum
        expr: localized_estimated_wishpost_shipping_cost
        fill_nulls_with: 0
      - name: initial_wishpost_tracking_id_item_localized_amount
        description: >
          Total initial WishPost tracking item amount localized into the
          settlement currency.
        type: simple
        agg: sum
        expr: initial_wishpost_tracking_id_item_localized_amount
        fill_nulls_with: 0
      - name: avg_merchant_currency_exchange_rate
        description: >
          Average merchant currency exchange rate.
        type: simple
        agg: average
        expr: merchant_currency_exchange_rate
      - name: avg_merchant_currency_hedged_exchange_rate
        description: >
          Average hedged merchant currency exchange rate.
        type: simple
        agg: average
        expr: merchant_currency_hedged_exchange_rate
      - name: avg_merchant_currency_daily_exchange_rate
        description: >
          Average daily merchant currency exchange rate.
        type: simple
        agg: average
        expr: merchant_currency_daily_exchange_rate
      - name: refund_rate
        description: >
          Share of merchant transactions that were refunded: refunded
          transactions / total orders.
        type: ratio
        numerator: refunded_transactions
        denominator: orders
      - name: avg_order_value
        description: >
          Average GMV per merchant transaction: GMV / total orders.
        type: ratio
        numerator: gmv
        denominator: orders
