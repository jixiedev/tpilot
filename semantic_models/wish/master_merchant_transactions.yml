version: 2

models:
  - name: master_merchant_transactions
    description: >
      Merchant transaction fact table for the Wish platform - one row per
      merchant transaction (`m_transaction_id`, the MongoDB
      `MerchantTransaction._id` and the documented primary key). Built daily
      by the Airflow DAG `dag_mt_incremental_tahoe.py` (01:00 UTC) from the
      MongoDB `MerchantTransaction` collection, enriched with commerce
      transaction, order tracking, shipping estimate, merchant warehouse and
      payment/refund records; `dag_mtri_incremental_tahoe.py` backfills
      pre-2021 rows into `legacy_master_merchant_transactions`. The physical
      table is partitioned by `dt` (varchar YYYY-MM-DD) and the wrapper
      materializes as a view in `semantic_dw`, so
      `wish.master_merchant_transactions` is never overwritten. `dt` is the
      default metric time dimension; `order_date`, `transaction_date`,
      `merchant_payment_date` and `refunded_date` are additional day-
      granularity time dimensions. The unix-epoch integer timestamp columns
      are kept as-is and mirrored as `_ts` timestamps for joins. The
      documented enums `state`, `merchant_payment_status`,
      `refund_reason_category` and `withhold_reason` are exposed as a raw code
      dimension plus a human-readable `*_name` dimension. Join to merchant /
      product / variation / warehouse dimensions in a Tableau datasource model
      that `ref()`s this wrapper - no dimension joins happen here.
    config:
      meta:
        owner: data-governance
        hive_table: wish.master_merchant_transactions
        dag_id: dag_mt_incremental_tahoe.py
        legacy_table: wish.legacy_master_merchant_transactions
    semantic_model:
      enabled: true
      name: master_merchant_transactions
      config:
        meta:
          usage: >
            One row per merchant transaction. `dt` is the daily partition and
            must always be filtered for pruning; it is also the default metric
            time dimension, so additive metrics are computed per partition
            day. The upstream ETL is a Magnolia change-data-capture merge over
            MongoDB, so a merchant transaction that is edited upstream can be
            re-emitted in a later `dt` partition - deduplicate on
            `m_transaction_id` if a partition-spanning aggregate must be
            treated as unique. Use `order_date` / `merchant_payment_date` /
            `refunded_date` for the business time axis. Amounts are buyer-paid
            (`gmv` from `paid_amount`) and merchant-side (`merchant_price`,
            `merchant_shipping`, `merchant_payment_amount`) - they are not
            interchangeable. `state` / `state_name` slice the order lifecycle;
            the `_name` variants of the four documented enums are the readable
            dimension. `refunded_*` metrics are filtered to `state` = 5, the
            unprefixed ones cover every row.
    agg_time_dimension: dt

    columns:
      - name: m_transaction_id
        description: >
          Unique merchant transaction identifier (ObjectId). One merchant
          transaction. The documented primary key of the table.
        data_tests:
          - not_null
        entity:
          type: primary
          name: merchant_transaction
          description: One merchant transaction. The documented primary key of the table.
      - name: user_id
        description: >
          Customer user identifier. Customer who placed the order.
        entity:
          type: foreign
          name: user
          description: Customer who placed the order.
      - name: merchant_id
        description: >
          Merchant identifier. Merchant selling the ordered product.
        entity:
          type: foreign
          name: merchant
          description: Merchant selling the ordered product.
      - name: c_transaction_id
        description: >
          Commerce transaction identifier. Commerce (buyer-facing)
          transaction. One commerce transaction maps to many merchant
          transactions.
        entity:
          type: foreign
          name: transaction
          description: Commerce (buyer-facing) transaction. One commerce transaction maps to many merchant transactions.
      - name: product_id
        description: >
          Product identifier. Ordered product.
        entity:
          type: foreign
          name: product
          description: Ordered product.
      - name: variation_id
        description: >
          Product variation identifier. Ordered product variation (SKU level).
        entity:
          type: foreign
          name: variation
          description: Ordered product variation (SKU level).
      - name: merchant_payment_id
        description: >
          Merchant payment identifier. Merchant payment record this
          transaction settled against.
        entity:
          type: foreign
          name: merchant_payment
          description: Merchant payment record this transaction settled against.
      - name: merchant_refund_id
        description: >
          Merchant refund identifier. Merchant refund record linked to this
          transaction.
        entity:
          type: foreign
          name: merchant_refund
          description: Merchant refund record linked to this transaction.
      - name: wish_fulfill_provider_id
        description: >
          Wish fulfillment provider identifier. WishPost fulfillment provider
          handling the order.
        entity:
          type: foreign
          name: fulfill_provider
          description: WishPost fulfillment provider handling the order.
      - name: wish_fulfill_warehouse_id
        description: >
          Wish fulfillment warehouse identifier. WishPost fulfillment
          warehouse handling the order.
        entity:
          type: foreign
          name: fulfill_warehouse
          description: WishPost fulfillment warehouse handling the order.
      - name: merchant_warehouse_id
