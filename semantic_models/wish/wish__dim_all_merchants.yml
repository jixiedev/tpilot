    metrics:
      # ------------------------------------------------------- merchant counts
      - name: merchants
        type: simple
        label: Merchants
        description: >
          Distinct merchant count (merchant_id) in the selected scope.
        agg: count_distinct
        expr: merchant_id

      - name: merchant_rows
        type: simple
        label: Merchant rows
        description: >
          Row count at merchant grain (one row per merchant). The producer
          DAG de-duplicates merchant_id, so this normally equals `merchants`.
        agg: count
        expr: 1

      - name: approved_merchants
        type: simple
        label: Approved merchants
        description: >
          Distinct merchants with state = 2 (APPROVED).
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__state') }} = 2"

      - name: pending_merchants
        type: simple
        label: Pending merchants
        description: >
          Distinct merchants with state = 1 (PENDING), i.e. the application
          is awaiting approval.
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__state') }} = 1"

      - name: disabled_merchants
        type: simple
        label: Disabled merchants
        description: >
          Distinct merchants with state = 3 (DISABLED).
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__state') }} = 3"

      - name: vacation_merchants
        type: simple
        label: Vacation merchants
        description: >
          Distinct merchants with state = 6 (VACATION).
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__state') }} = 6"

      - name: trusted_channel_merchants
        type: simple
        label: Trusted channel merchants
        description: >
          Distinct merchants with from_trusted_channel = 'true'.
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__from_trusted_channel') }} = 'true'"

      - name: deliverr_merchants
        type: simple
        label: Deliverr merchants
        description: >
          Distinct merchants with is_deliverr_merchant = 'true'.
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__is_deliverr_merchant') }} = 'true'"

      - name: active_merchants
        type: simple
        label: Active merchants
        description: >
          Distinct merchants with is_active = 'true'.
        agg: count_distinct
        expr: merchant_id
        filter: "{{ Dimension('merchant__is_active') }} = 'true'"

      # ------------------------------------------------------ quality measures
      - name: average_rating
        type: simple
        label: Average rating
        description: >
          Average of the merchants' overall average rating (0.0-5.0). A rate
          -- average it, do not sum it.
        agg: average
        expr: average_rating

      - name: average_rating_14_days
        type: simple
        label: Average rating (14 days)
        description: >
          Average of the merchants' average rating over the last 14 days.
        agg: average
        expr: average_rating_14_days

      - name: average_rating_display
        type: simple
        label: Average rating (display)
        description: >
          Average of the merchants' display-version average rating.
        agg: average
        expr: average_rating_display

      - name: rating_count
        type: simple
        label: Rating count
        description: >
          Sum of the total number of ratings received by the merchants in
          scope. Merchant-grain snapshot -- not additive over time.
        agg: sum
        expr: rating_count

      - name: rating_count_14_days
        type: simple
        label: Rating count (14 days)
        description: >
          Sum of the number of ratings received in the last 14 days.
        agg: sum
        expr: rating_count_14_days

      # ----------------------------------------------------- activity measures
      - name: num_active_products
        type: simple
        label: Active products
        description: >
          Sum of the number of active products across the merchants in scope.
        agg: sum
        expr: num_active_products

      # ------------------------------------------------------ payment measures
      - name: rev_share
        type: simple
        label: Revenue share
        description: >
          Average of the merchants' revenue share (decimal 0.0-1.0). A rate
          -- average it, do not sum it.
        agg: average
        expr: rev_share

      # -------------------------------------------------- fulfilment measures
      - name: avg_fulfillment_time
        type: simple
        label: Average fulfillment time
        description: >
          Average of the merchants' average fulfillment time in seconds.
        agg: average
        expr: avg_fulfillment_time_seconds

      - name: avg_shipping_time
        type: simple
        label: Average shipping time
        description: >
          Average of the merchants' average shipping time in seconds.
        agg: average
        expr: avg_shipping_time_seconds

      - name: us_30_day_avg_fulfillment_time
        type: simple
        label: US average fulfillment time
        description: >
          Average of the merchants' US average fulfillment time in days.
        agg: average
        expr: us_30_day_avg_fulfillment_time_days

      - name: us_30_day_avg_delivery_time
        type: simple
        label: US average delivery time
        description: >
          Average of the merchants' US average delivery time in days.
        agg: average
        expr: us_30_day_avg_delivery_time_days

      # --------------------------------------------------------- ratio metrics
      - name: rating_count_per_merchant
        type: ratio
        label: Rating count per merchant
        description: >
          Total ratings received per merchant in scope.
        numerator: rating_count
        denominator: merchants
