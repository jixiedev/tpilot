# Local Qdrant for TahoePilot RAG (Jira / docs vectors).
# From this directory: docker compose up -d
# REST :6333  gRPC :6334  Dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: tahoepilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
